name: Format Check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: format-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: 格式检查
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 设置 uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.3"
          python-version: "3.12"

      - name: 检查 Python 格式
        run: |
          uv sync --locked
          uv run --no-sync ruff format --check .
