<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AUTO-MAS 档案终端演示</title>
<link rel="stylesheet" href="../../frontend/public/fonts/misans/misans.css" />
<style>
:root {
  --bg: #e6e3df;
  --ink: #0b0c0b;
  --paper: #f6f4f1;
  --muted: #77756d;
  --hair: #aaa59a;
  --grid: rgba(120, 116, 106, 0.16);
  --accent: #e8701f;
  --amber: #9b7247;
  --font: 'AUTO-MAS MiSans', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font-family: var(--font); color: var(--ink); }
/* 1920×1080 参考舞台，按窗口等比缩放 */
#viewport { position: fixed; inset: 0; }
#stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: center; overflow: hidden; background: var(--bg); }
svg { display: block; }

/* ─────────── 启动动画 ─────────── */
#boot { position: absolute; inset: 0; z-index: 50; background: #fff; transition: transform .8s cubic-bezier(.5,0,.2,1), filter .8s ease, opacity .6s ease; }
#boot.leave { transform: scale(.86); filter: blur(10px) hue-rotate(160deg) saturate(.6); opacity: 0; }
#boot.flash { filter: invert(1); }
#b-black { position: absolute; inset: 0; background: #000; display: grid; place-items: center; transition: opacity .25s; }
#b-black svg { width: 120px; opacity: 0; animation: fade-in .9s .1s ease forwards; }
#b-black.off { opacity: 0; pointer-events: none; }
#b-type { position: absolute; left: 0; right: 0; top: 520px; text-align: center; font-size: 22px; font-weight: 700; letter-spacing: .32em; white-space: pre; }
#b-type .caret { display: inline-block; width: 12px; height: 22px; margin-left: 4px; background: var(--ink); vertical-align: -3px; animation: blink .5s steps(1) infinite; }
#b-ident { position: absolute; left: 0; right: 0; top: 470px; display: flex; flex-direction: column; align-items: center; gap: 22px; font-size: 22px; font-weight: 700; letter-spacing: .3em; }
#b-ident .spin { display: inline-block; width: 18px; height: 18px; margin-right: 12px; border: 3px solid var(--ink); border-right-color: transparent; border-radius: 50%; vertical-align: -2px; animation: spin .6s linear infinite; }

#b-logo { position: absolute; left: 860px; top: 440px; width: 200px; height: 200px; transition: transform .9s cubic-bezier(.2,.8,.1,1); }
#b-logo.shift { transform: translateX(-250px); }
#b-logo .draw { fill: none; stroke: var(--ink); stroke-width: 7; stroke-dasharray: 700; stroke-dashoffset: 700; }
#b-logo.play .draw { animation: draw 1.3s cubic-bezier(.6,0,.2,1) forwards; }
#b-logo .tick { stroke: var(--ink); stroke-width: 7; opacity: 0; }
#b-logo.play .tick { animation: fade-in .2s 1.05s forwards; }
#b-logo .core { fill: var(--accent); transform-origin: 100px 100px; transform: scale(0); }
#b-logo.play .core { animation: pop .35s 1.2s cubic-bezier(.3,1.6,.5,1) forwards; }

#b-brand { position: absolute; left: 870px; top: 470px; width: 300px; transition: left .9s cubic-bezier(.6,0,.2,1), top .9s cubic-bezier(.6,0,.2,1), transform .9s cubic-bezier(.6,0,.2,1); transform-origin: left top; }
#b-brand.corner { left: 59px; top: 64px; transform: scale(.9); }
.brand-line { opacity: 0; transform: translateX(120px); transition: transform .7s cubic-bezier(.1,.9,.2,1), opacity .2s; white-space: nowrap; }
.brand-line.in { opacity: 1; transform: none; }
.brand-1 { font-size: 46px; line-height: 50px; font-weight: 700; letter-spacing: 2.5px; }
.brand-2 { font-size: 15px; line-height: 22px; font-weight: 600; letter-spacing: 1.6px; }
.brand-3 { font-size: 35px; line-height: 40px; font-weight: 700; letter-spacing: 6px; }

#b-auth { position: absolute; inset: 0; opacity: 0; }
#b-auth.play { opacity: 1; }
#b-auth .ring-outer { fill: none; stroke: var(--ink); stroke-width: 30; transform-origin: 960px 540px; transform: scale(3); }
#b-auth.play .ring-outer { animation: converge 1.1s cubic-bezier(.1,.8,.2,1) forwards; }
#b-auth .ring-white { fill: none; stroke: #fff; stroke-width: 8; stroke-dasharray: 1100 400; transform-origin: 960px 540px; transform: scale(2.4) rotate(0); }
#b-auth.play .ring-white { animation: converge-rot 1.3s .1s cubic-bezier(.1,.8,.2,1) forwards; }
#b-auth .arc-inner { fill: none; stroke: var(--ink); stroke-width: 5; stroke-dasharray: 340 900; transform-origin: 960px 540px; }
#b-auth.play .arc-inner { animation: rot-rev 3.2s .4s cubic-bezier(.2,.7,.2,1) forwards; }
#b-auth .node { fill: var(--accent); transform-origin: 960px 540px; }
#b-auth.play .node { animation: rot 3.2s .5s cubic-bezier(.3,.6,.2,1) forwards; }
#b-auth .jump { transform-origin: 960px 540px; }
#b-auth.play .jump { animation: jumps .5s 1.4s steps(1) forwards; }
#b-auth .center { fill: var(--ink); transform-origin: 960px 540px; }
#b-auth.play .center { animation: center-flick .8s 2.2s steps(1) forwards; }
#b-auth .orbit { transform-origin: 960px 540px; opacity: 0; }
#b-auth.play .orbit { animation: orbit 2s 2.4s linear forwards; }
#b-auth .side { fill: none; stroke: var(--ink); stroke-width: 6; stroke-dasharray: 0 400; }
#b-auth.play .side-l { animation: side-l 1.8s 1.6s cubic-bezier(.2,.8,.2,1) forwards; transform-origin: 600px 540px; }
#b-auth.play .side-r { animation: side-r 1.8s 1.6s cubic-bezier(.2,.8,.2,1) forwards; transform-origin: 1320px 540px; }
#b-auth .granted { font-size: 18px; font-weight: 700; letter-spacing: .4em; fill: var(--ink); opacity: 0; }
#b-auth.play .granted { animation: fade-in .1s 2.9s steps(1) forwards; }

#b-welcome { position: absolute; left: 0; right: 0; top: 380px; display: none; flex-direction: column; align-items: center; gap: 14px; }
#b-welcome.play { display: flex; }
#b-welcome .w1 { font-size: 64px; font-weight: 700; letter-spacing: .14em; }
#b-welcome .w2 { position: relative; font-size: 96px; line-height: 1.15; font-weight: 700; letter-spacing: .12em; padding: 0 40px; color: #fff; isolation: isolate; }
#b-welcome .w2::before { content: ''; position: absolute; inset: 0; z-index: -1; background: var(--ink); transform: scaleX(0); transform-origin: left; animation: sweep .9s .15s cubic-bezier(.05,.9,.2,1) forwards; }
#b-welcome .w3 { font-size: 42px; font-weight: 700; letter-spacing: .3em; opacity: 0; animation: flash3 .9s .7s steps(1) forwards; }

#skip { position: absolute; right: 48px; bottom: 40px; z-index: 60; font: 600 14px var(--font); letter-spacing: .3em; color: var(--muted); background: none; border: 1px solid var(--hair); padding: 10px 18px; cursor: pointer; }
#skip:hover { color: var(--ink); border-color: var(--ink); }

/* ─────────── 部门索引（一级界面） ─────────── */
#hub { position: absolute; inset: 0; background:
  linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 96px 96px,
  linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 96px 96px,
  radial-gradient(ellipse at 50% 50%, #f1efec 0%, var(--bg) 70%); }
.hub-diag { position: absolute; inset: 0; pointer-events: none; }
.hub-diag line { stroke: #3a3a36; stroke-width: 1.4; stroke-dasharray: 900; stroke-dashoffset: 900; }
#hub.in .hub-diag line { transition: stroke-dashoffset 1.2s cubic-bezier(.6,0,.2,1); stroke-dashoffset: 0; }
.cross { position: absolute; width: 60px; height: 60px; pointer-events: none; opacity: .5; }
.cross::before, .cross::after { content: ''; position: absolute; background: #fff; }
.cross::before { left: 29px; top: 0; width: 2px; height: 60px; }
.cross::after { top: 29px; left: 0; height: 2px; width: 60px; }

.ghost-brand { position: absolute; left: 59px; top: 64px; filter: blur(2.5px); opacity: .35; pointer-events: none; }
.ghost-ring { position: absolute; right: -150px; top: -260px; width: 560px; height: 560px; border: 70px solid rgba(255,255,255,.75); border-radius: 50%; filter: blur(1.5px); pointer-events: none; }
.ghost-letters { position: absolute; right: 80px; top: 170px; font-size: 30px; font-weight: 700; letter-spacing: 1.6em; color: rgba(255,255,255,.85); pointer-events: none; }

.tile { position: absolute; transform: translate(-50%, -50%) translate(calc(var(--px, 0) * 1px), calc(var(--py, 0) * 1px)) scale(var(--s, 1)); transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .5s, filter .3s, box-shadow .3s; cursor: pointer; border: none; padding: 0; font: inherit; color: inherit; background: none; opacity: 0; }
#hub.in .tile { opacity: 1; }
.tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 8px; }
.tile.card { background: var(--paper); box-shadow: 0 0 0 1px rgba(0,0,0,.04), 0 18px 40px -24px rgba(0,0,0,.25); }
.tile.ink { background: var(--ink); color: #fff; }
.tile.ink.textured { background: radial-gradient(circle at 30% 70%, #2a2c2b 0, transparent 45%), linear-gradient(160deg, #0b0c0b 0%, #1c1e1d 55%, #0b0c0b 100%); }
.tile.bare { background: transparent; }
.tile:hover, .tile.focus { --s: 1.05; z-index: 5; }
#hub.has-focus .tile:not(.focus):not(.deco) { filter: saturate(.6) opacity(.75); }
.tile.deco { cursor: default; pointer-events: none; }
.tile-inner { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.code { position: relative; font-weight: 700; line-height: .86; letter-spacing: -.02em; }
.code .mk { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: .5em; height: .5em; }
.sub { margin-top: 6px; font-size: 11px; font-weight: 600; letter-spacing: .06em; white-space: nowrap; }
.zh { margin-top: 8px; font-size: 14px; font-weight: 600; letter-spacing: .3em; opacity: .7; }
.idx { position: absolute; left: 10px; top: 8px; font-size: 12px; font-weight: 600; letter-spacing: .1em; opacity: .55; }
.accent-block { position: absolute; width: 38px; height: 38px; background: var(--accent); }
.accent-block::after { content: ''; position: absolute; left: 12px; top: 12px; width: 14px; height: 26px; background: #fff; }

#searching { position: absolute; z-index: 20; display: flex; align-items: center; gap: 0; transform: translate(-50%, -100%); transition: left .35s cubic-bezier(.2,.8,.2,1), top .35s cubic-bezier(.2,.8,.2,1), opacity .3s; pointer-events: none; opacity: 0; }
#hub.in #searching { opacity: 1; }
#searching i { width: 14px; height: 10px; background: var(--ink); }
#searching span { border: 1.5px solid var(--ink); background: var(--paper); padding: 3px 14px; font-size: 13px; font-weight: 700; letter-spacing: .08em; white-space: nowrap; }

.ledger { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; display: flex; align-items: center; gap: 28px; padding: 0 48px; font-size: 12px; font-weight: 600; letter-spacing: .2em; color: var(--muted); }
.ledger .sq { width: 26px; height: 26px; background: #8b8a85; }
.ruler { display: flex; align-items: flex-end; gap: 22px; height: 26px; }
.ruler button { position: relative; width: 22px; height: 26px; border: none; background: none; cursor: pointer; padding: 0; }
.ruler button i { position: absolute; left: 10px; bottom: 0; width: 2px; height: 10px; background: var(--hair); transition: height .2s, background .2s; }
.ruler button b { position: absolute; left: 0; right: 0; top: -6px; font-size: 9px; color: var(--muted); font-weight: 600; letter-spacing: 0; }
.ruler button.on i { height: 22px; background: var(--accent); }
.ledger .grow { flex: 1; }

/* ─────────── 二级界面（参考 PV 1:19 之后）：方块左移 → 左下录像带轮盘 → 右侧档案 ─────────── */
#hub.sectioned .tile:not(.s-clone), #hub.sectioned .hub-diag, #hub.sectioned #searching, #hub.sectioned .cross, #hub.sectioned .hint, #hub.sectioned .ghost-letters, #hub.sectioned .ghost-brand {
  opacity: 0 !important; pointer-events: none; transition: opacity .28s ease !important;
}
#hub .hub-diag, #hub .cross, #hub .hint, #hub .ghost-letters, #hub .ghost-brand { transition: opacity .4s ease .35s; }
#sect { position: absolute; inset: 0 0 56px 0; z-index: 30; pointer-events: none; }
#sect.on { pointer-events: auto; }
.s-clone { position: absolute; z-index: 31; opacity: 1 !important; transform-origin: 0 0 !important; transition: transform .7s cubic-bezier(.75,0,.15,1) !important; pointer-events: none; }
.s-clone.focus { --s: 1; }

/* 方块下方的部门说明 */
.s-caption { position: absolute; left: 80px; top: 432px; width: 320px; opacity: 0; transform: translateX(-16px); transition: opacity .3s, transform .4s cubic-bezier(.2,.8,.2,1); }
#sect.reel-in .s-caption { opacity: 1; transform: none; transition-delay: .1s; }
.s-caption .k { font-size: 12px; font-weight: 700; letter-spacing: .24em; color: var(--muted); }
.s-caption .z { margin-top: 8px; font-size: 30px; font-weight: 700; letter-spacing: .16em; }
.s-caption .c { margin-top: 10px; font-size: 13px; color: var(--muted); letter-spacing: .1em; line-height: 1.7; }
.s-caption .bar { margin-top: 14px; height: 2px; width: 100%; background: var(--ink); transform-origin: left; transform: scaleX(0); transition: transform .5s cubic-bezier(.7,0,.2,1) .2s; }
#sect.reel-in .s-caption .bar { transform: scaleX(1); }

/* 左下录像带轮盘 */
#reel { position: absolute; left: -330px; top: 480px; width: 1000px; height: 1000px; pointer-events: none; overflow: visible; }
#reel .ring { fill: none; stroke: var(--ink); stroke-dasharray: 2800; stroke-dashoffset: 2800; transition: stroke-dashoffset .9s cubic-bezier(.6,0,.2,1); }
#sect.reel-in #reel .ring { stroke-dashoffset: 0; }
#reel .spool { opacity: 0; transform: scale(.82) rotate(-60deg); transform-origin: 500px 500px; transition: opacity .35s, transform .9s cubic-bezier(.2,.8,.2,1); }
#sect.reel-in #reel .spool { opacity: 1; transform: none; transition-delay: .15s; }
#reel .ticks line { stroke: var(--hair); stroke-width: 1.2; }
#reel .ticks line.major { stroke: var(--ink); stroke-width: 2; }
#reel .ticks { opacity: 0; transition: opacity .4s .35s; }
#sect.reel-in #reel .ticks { opacity: 1; }
#reel-labels { position: absolute; inset: 0; pointer-events: none; }
.r-label { position: absolute; display: flex; align-items: baseline; gap: 12px; white-space: nowrap; transform: translateY(-50%); cursor: pointer; pointer-events: auto; font-weight: 700; letter-spacing: .1em; color: var(--muted); transition: color .2s, font-size .2s; background: none; border: none; font-family: var(--font); padding: 4px 6px; }
.r-label b { font-size: 12px; font-weight: 700; letter-spacing: .1em; color: var(--hair); }
.r-label.on { color: var(--ink); font-size: 24px; }
.r-label.on b { color: var(--accent); font-size: 14px; }
.r-label:not(.on) { font-size: 17px; }
.r-label:hover { color: var(--ink); }
.r-pointer { position: absolute; height: 2px; background: var(--accent); transform-origin: 0 50%; opacity: 0; transition: opacity .3s .5s; }
#sect.reel-in .r-pointer { opacity: 1; }
.s-caption .hint2 { margin-top: 10px; font-size: 11px; letter-spacing: .2em; color: var(--muted); } .r-hint { position: absolute; left: 80px; top: 560px; font-size: 11px; letter-spacing: .24em; color: var(--muted); opacity: 0; transition: opacity .3s .6s; }
#sect.reel-in .r-hint { opacity: 1; }

/* 右侧档案面板 */
#s-panel { position: absolute; left: 720px; right: 72px; top: 92px; bottom: 28px; display: flex; flex-direction: column; }
#s-panel .sp-head, #s-panel .blk, #s-panel .sp-actions { opacity: 0; transform: translateY(14px); transition: opacity .3s ease, transform .45s cubic-bezier(.2,.8,.2,1); }
#s-panel.show .sp-head, #s-panel.show .blk, #s-panel.show .sp-actions { opacity: 1; transform: none; }
.sp-meta { display: flex; gap: 18px; font-size: 12px; font-weight: 700; letter-spacing: .24em; color: var(--muted); }
.sp-meta .a { color: var(--accent); }
.sp-title { margin-top: 12px; display: flex; align-items: baseline; gap: 22px; }
.sp-title .sp-idx { font-size: 54px; font-weight: 300; color: var(--muted); font-variant-numeric: tabular-nums; }
.sp-title h2 { margin: 0; font-size: 46px; font-weight: 700; letter-spacing: .08em; }
.sp-title .en { font-size: 14px; font-weight: 700; letter-spacing: .3em; color: var(--muted); }
.sp-rule { margin-top: 16px; height: 2px; background: var(--ink); transform-origin: left; transform: scaleX(0); transition: transform .6s cubic-bezier(.7,0,.2,1) .1s; }
#s-panel.show .sp-rule { transform: scaleX(1); }
.sp-body { flex: 1; min-height: 0; overflow: auto; margin-top: 26px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 28px; align-content: start; padding-right: 6px; }
.blk { min-width: 0; }
.blk.wide { grid-column: 1 / -1; }
.blk-h { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; font-size: 12px; font-weight: 700; letter-spacing: .22em; color: var(--muted); }
.blk-h::after { content: ''; flex: 1; height: 1px; background: var(--hair); }
.blk-h i { width: 14px; height: 2px; background: var(--accent); }
.kv { display: grid; grid-template-columns: 140px 1fr; border-top: 1px solid var(--hair); }
.kv > div { padding: 11px 4px; border-bottom: 1px solid var(--hair); font-size: 15px; }
.kv .k { color: var(--muted); font-size: 13px; letter-spacing: .1em; }
.tbl { width: 100%; border-collapse: collapse; font-size: 15px; }
.tbl th { text-align: left; font-size: 12px; font-weight: 700; letter-spacing: .18em; color: var(--muted); padding: 8px 6px; border-bottom: 2px solid var(--ink); }
.tbl td { padding: 11px 6px; border-bottom: 1px solid var(--hair); }
.tbl td.n { width: 44px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tag { display: inline-block; padding: 2px 9px; font-size: 12px; font-weight: 700; letter-spacing: .12em; border: 1px solid currentColor; }
.tag.ok { color: #55785a; } .tag.warn { color: #b8752c; } .tag.err { color: #b6453c; } .tag.idle { color: var(--muted); } .tag.run { color: var(--paper); background: var(--ink); border-color: var(--ink); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--hair); border-left: 1px solid var(--hair); }
.stats div { padding: 14px 16px; border-right: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
.stats b { display: block; font-size: 40px; font-weight: 300; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; letter-spacing: .2em; color: var(--muted); }
.quote { font-size: 30px; font-weight: 700; line-height: 1.5; letter-spacing: .04em; padding: 18px 0 8px; }
.quote + .by { text-align: right; color: var(--muted); letter-spacing: .1em; }
.lst { border-top: 1px solid var(--hair); }
.lst div { display: flex; gap: 18px; padding: 11px 4px; border-bottom: 1px solid var(--hair); font-size: 15px; }
.lst div em { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 64px; }
.log { margin: 0; height: 230px; overflow: auto; background: var(--ink); color: #d9d6cf; font: 13px/1.7 Consolas, monospace; padding: 12px 16px; }
.log .e { color: #e58a7f; } .log .s { color: #9cc79f; }
.banner { position: relative; height: 210px; overflow: hidden; background: var(--bg-b, linear-gradient(120deg, #1d2a2a, #49573f 55%, #c9b27a)); color: #fff; padding: 22px 26px; display: flex; flex-direction: column; justify-content: space-between; }
.banner .v { align-self: flex-start; font-size: 13px; font-weight: 700; letter-spacing: .2em; padding: 3px 10px; border: 1px solid rgba(255,255,255,.7); }
.banner h3 { margin: 0; font-size: 40px; letter-spacing: .1em; }
.banner .cd { position: absolute; right: 22px; bottom: 20px; text-align: right; font-size: 12px; letter-spacing: .2em; }
.banner .cd b { display: block; font-size: 34px; letter-spacing: .04em; }
.tog { display: inline-flex; align-items: center; gap: 8px; }
.tog i { width: 34px; height: 16px; border: 1.5px solid var(--ink); position: relative; }
.tog i::after { content: ''; position: absolute; top: 2px; left: 2px; width: 10px; height: 9px; background: var(--muted); transition: left .2s; }
.tog.on i::after { left: 19px; background: var(--accent); }
.sp-actions { display: flex; gap: 12px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--hair); }
.btn { font: 700 14px var(--font); letter-spacing: .14em; padding: 11px 22px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; }
.btn.pri { background: var(--ink); color: var(--paper); }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.pri:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.dng:hover { border-color: #b6453c; color: #b6453c; }
#s-back { position: absolute; right: 72px; top: 30px; font: 700 13px var(--font); letter-spacing: .28em; background: none; border: 1.5px solid var(--ink); padding: 9px 18px; cursor: pointer; opacity: 0; transition: opacity .3s .5s; }
#sect.reel-in #s-back { opacity: 1; }
#s-back:hover { background: var(--ink); color: #fff; }
/* 切换条目：PV 式黑条横扫 */
#s-wipe { position: absolute; left: 720px; right: 72px; top: 150px; height: 60px; background: var(--ink); transform: scaleX(0); transform-origin: left; pointer-events: none; z-index: 2; }
#s-wipe.go { animation: wipe .42s cubic-bezier(.7,0,.2,1); }
@keyframes wipe { 0% { transform: scaleX(0); transform-origin: left; } 49% { transform: scaleX(1); transform-origin: left; } 51% { transform: scaleX(1); transform-origin: right; } 100% { transform: scaleX(0); transform-origin: right; } }

.hint { position: absolute; right: 48px; bottom: 70px; font-size: 12px; letter-spacing: .2em; color: var(--muted); text-align: right; line-height: 1.8; }

]

const stage = document.getElementById('stage')
const hub = document.getElementById('hub')
const tilesEl = document.getElementById('tiles')
const searching = document.getElementById('searching')
const ruler = document.getElementById('ruler')
const ledgerLabel = document.getElementById('ledger-label')
const tiles = []

function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080)
  stage.style.transform = `translate(-50%, -50%) scale(${s})`
}
addEventListener('resize', fit); fit()

function codeHtml(d) {
  // 在字形中段叠一枚自有标志，对应 PV 部门标里嵌入的符号
  const lines = d.code.split('\n').map((l, i) => {
    const mk = i === d.code.split('\n').length - 1 ? '<svg class="mk"><use href="#mark" /></svg>' : ''
    return `<div class="code" style="font-size:${d.size}px">${l}${mk}</div>`
  }).join('')
  return lines
}

DEPTS.forEach((d, i) => {
  const b = document.createElement('button')
  b.type = 'button'
  b.className = `tile ${d.style}${d.textured ? ' textured' : ''}`
  Object.assign(b.style, { left: d.x + 'px', top: d.y + 'px', width: d.w + 'px', height: d.h + 'px', transitionDelay: `${i * 45}ms` })
  b.setAttribute('aria-label', `${d.n} ${d.zh}`)
  b.innerHTML = `<div class="tile-inner">
    ${d.style !== 'bare' ? `<span class="idx">${d.n}</span>` : ''}
    ${d.accent ? '<span class="accent-block" style="right:-22px;top:-26px"></span>' : ''}
    ${codeHtml(d)}
    <div class="sub">${d.sub}</div>
    <div class="zh">${d.zh}</div>
  </div>`
  b.addEventListener('mouseenter', () => focusTile(i))
  b.addEventListener('focus', () => focusTile(i))
  b.addEventListener('click', () => openSection(i))
  tilesEl.appendChild(b)
  tiles.push({ el: b, d })

  const r = document.createElement('button')
  r.type = 'button'
  r.setAttribute('aria-label', `${d.n} ${d.zh}`)
  r.innerHTML = `<b>${d.n}</b><i></i>`
  r.addEventListener('click', () => { focusTile(i); openSection(i) })
  r.addEventListener('mouseenter', () => focusTile(i))
  ruler.appendChild(r)
})
DECOS.forEach(d => {
  const el = document.createElement('div')
  el.className = 'tile deco'
  Object.assign(el.style, { left: d.x + 'px', top: d.y + 'px', width: d.w + 'px', height: d.h + 'px', filter: d.blur ? `blur(${d.blur}px)` : '' })
  el.innerHTML = d.html
  tilesEl.appendChild(el)
  tiles.push({ el, d })

let current = CENTER
function focusTile(i) {
  current = i

  ledgerLabel.textContent = `X-0${d.n} ${d.zh}`
}

let mx = 0, my = 0, tx = 0, ty = 0, raf = 0
hub.addEventListener('mousemove', e => {
  const r = stage.getBoundingClientRect()
  tx = ((e.clientX - r.left) / r.width - .5) * 2
  ty = ((e.clientY - r.top) / r.height - .5) * 2
})
function loop(t) {
  mx += (tx - mx) * .08; my += (ty - my) * .08
  tiles.forEach((tl, k) => {
    const dp = tl.d.depth || 10
    const fx = Math.sin(t / 2600 + k) * dp * .15, fy = Math.cos(t / 3100 + k * 1.7) * dp * .15

    tl.el.style.setProperty('--py', (-my * dp + fy).toFixed(2))
  })
  raf = requestAnimationFrame(loop)
}
document.addEventListener('visibilitychange', () => { cancelAnimationFrame(raf); if (!document.hidden) raf = requestAnimationFrame(loop) })
raf = requestAnimationFrame(loop)

function renderBlock(b) {
  const head = b.title ? `<div class="blk-h"><i></i>${b.title}</div>` : ''
  let body = ''
  if (b.t === 'kv') body = `<div class="kv">${b.rows.map(([k, v]) => `<div class="k">${k}</div><div>${v}</div>`).join('')}</div>`
  else if (b.t === 'table') body = `<table class="tbl"><thead><tr><th>#</th>${b.cols.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${b.rows.map((r, i) => `<tr><td class="n">${String(i + 1).padStart(2, '0')}</td>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`
  else if (b.t === 'stats') body = `<div class="stats">${b.rows.map(([k, v]) => `<div><b>${v}</b><span>${k}</span></div>`).join('')}</div>`
  else if (b.t === 'quote') body = `<div class="quote">“${b.text}”</div><div class="by">${b.by}</div>`
  else if (b.t === 'list') body = `<div class="lst">${b.rows.map(([a, c]) => `<div><em>${a}</em>${c}</div>`).join('')}</div>`
  else if (b.t === 'log') body = `<pre class="log">${b.lines.join('\n')}</pre>`
  else if (b.t === 'banner') body = `<div class="banner" style="--bg-b:${b.bg}"><span class="v">● ${b.v}</span><h3>${b.title}</h3><div class="cd">活动剩余时间<b>${b.left}</b></div></div>`
  return `<div class="blk${b.wide ? ' wide' : ''}">${head}${body}</div>`
}

const sect = document.getElementById('sect')
const panel = document.getElementById('s-panel')
const reelEl = document.getElementById('reel')
const reelSpool = document.getElementById('reel-spool')
const labelsEl = document.getElementById('reel-labels')
const pointer = document.getElementById('r-pointer')
const wipe = document.getElementById('s-wipe')
const REEL = { cx: 170, cy: 980, r: 420, step: 13, focus: -42 }
const state = { open: -1, items: [], pos: 0, target: 0, shown: -1, clone: null, raf: 0, timers: [] }
const later = (ms, fn) => state.timers.push(setTimeout(fn, ms))

// 刻度环一次画好；轮盘中心在左下 (170, 980)
;(function buildTicks() {
  const g = document.getElementById('reel-ticks')
  let html = ''
  for (let a = 0; a < 360; a += 3) {
    const major = a % 15 === 0
    const r1 = major ? 352 : 358, r2 = 366
    const t = (a * Math.PI) / 180
    html += `<line class="${major ? 'major' : ''}" x1="${500 + r1 * Math.cos(t)}" y1="${500 + r1 * Math.sin(t)}" x2="${500 + r2 * Math.cos(t)}" y2="${500 + r2 * Math.sin(t)}"/>`
  }
  g.innerHTML = html
  const p = (REEL.focus * Math.PI) / 180
  Object.assign(pointer.style, { left: REEL.cx + 372 * Math.cos(p) + 'px', top: REEL.cy + 372 * Math.sin(p) + 'px', width: '40px', transform: `rotate(${REEL.focus}deg)` })
})()

function layoutLabels() {
  const nodes = labelsEl.children
  for (let i = 0; i < nodes.length; i++) {
    const a = REEL.focus + (i - state.pos) * REEL.step
    const t = (a * Math.PI) / 180
    const el = nodes[i]
    const dist = Math.abs(i - state.pos)
    el.style.left = REEL.cx + REEL.r * Math.cos(t) + 'px'
    el.style.top = REEL.cy + REEL.r * Math.sin(t) + 'px'
    el.style.opacity = a < -112 || a > 18 ? 0 : Math.max(0, 1 - dist * 0.22)
    el.classList.toggle('on', i === state.target)
  }
  // 卷盘随选择转动，像磁带走带
  reelSpool.setAttribute('transform', `rotate(${-state.pos * 38} 500 500)`)
}

function tick() {
  state.pos += (state.target - state.pos) * 0.16
  if (Math.abs(state.target - state.pos) < 0.001) state.pos = state.target
  layoutLabels()
  if (state.open >= 0 && state.pos !== state.target) state.raf = requestAnimationFrame(tick)
  else state.raf = 0
}
const kick = () => { if (!state.raf) state.raf = requestAnimationFrame(tick) }

function renderPanel(withWipe) {
  const d = DEPTS[state.open]
  const item = state.items[state.target]
  const paint = () => {
    panel.classList.remove('show')
    panel.innerHTML = `
      <div class="sp-head">
        <div class="sp-meta"><span class="a">X-0${d.n}</span><span>${d.code.replace('\n', ' ')}</span><span>${d.sub}</span></div>
        <div class="sp-title"><span class="sp-idx">${d.n}-${String(state.target + 1).padStart(2, '0')}</span><h2>${item.name}</h2><span class="en">${item.en}</span></div>
        <div class="sp-rule"></div>
      </div>
      <div class="sp-body">${item.blocks.map(renderBlock).join('')}</div>
      <div class="sp-actions">${item.actions.map((a, i) => `<button class="btn${i === 0 ? ' pri' : ''}${/删除|停止/.test(a) ? ' dng' : ''}" type="button">${a}</button>`).join('')}</div>`
    // 逐块错开显现
    ;[...panel.querySelectorAll('.sp-head, .blk, .sp-actions')].forEach((el, k) => { el.style.transitionDelay = `${k * 70}ms` })
    panel.offsetWidth
    panel.classList.add('show')
    state.shown = state.target
  }
  if (withWipe) {
    wipe.classList.remove('go'); wipe.offsetWidth; wipe.classList.add('go')
    later(200, paint)
  } else paint()
}

let selectTimer = 0
function select(i) {
  if (state.open < 0) return
  const next = Math.max(0, Math.min(state.items.length - 1, i))
  if (next === state.target) return
  state.target = next
  kick()
  clearTimeout(selectTimer)
  selectTimer = setTimeout(() => { if (state.shown !== state.target) renderPanel(true) }, 140)
}

function openSection(i) {
  if (state.open >= 0 || booting) return
  const d = DEPTS[i]
  const conf = SECTIONS[d.n]
  state.open = i; state.items = conf.items; state.target = 0; state.pos = -3; state.shown = -1
  focusTile(i)
  hub.classList.add('sectioned')
  // ① 方块复制一份，从原位飞到左侧
  const src = tiles[i].el
  const clone = src.cloneNode(true)
  clone.classList.add('s-clone')
  clone.classList.remove('focus')
  Object.assign(clone.style, { left: d.x - d.w / 2 + 'px', top: d.y - d.h / 2 + 'px', transform: 'none', transitionDelay: '0ms' })
  clone.removeAttribute('aria-label'); clone.tabIndex = -1
  hub.appendChild(clone)
  state.clone = clone
  const size = 300, s = size / Math.max(d.w, d.h)
  const tx = 80 - (d.x - d.w / 2), ty = 110 - (d.y - d.h / 2) + (size - d.h * s) / 2
  clone.offsetWidth
  clone.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`
  document.getElementById('s-cap-k').textContent = `X-0${d.n} // ${d.sub}`
  document.getElementById('s-cap-z').textContent = d.zh
  document.getElementById('s-cap-c').textContent = `${conf.caption} 共 ${conf.items.length} 项。`
  // ② 轮盘绘出、条目从下方转入
  labelsEl.innerHTML = conf.items.map((it, k) => `<button type="button" class="r-label" data-k="${k}"><b>${d.n}-${String(k + 1).padStart(2, '0')}</b>${it.name}</button>`).join('')
  layoutLabels()
  later(420, () => { sect.classList.add('on', 'reel-in'); kick() })
  // ③ 右侧档案
  later(760, () => renderPanel(false))
  later(800, () => document.getElementById('s-back').focus({ preventScroll: true }))
}

function closeSection() {
  if (state.open < 0) return
  const i = state.open
  state.timers.forEach(clearTimeout); state.timers = []
  panel.classList.remove('show')
  sect.classList.remove('reel-in')
  state.target = -3; kick()
  setTimeout(() => { if (state.clone) state.clone.style.transform = 'none' }, 220)
  setTimeout(() => {
    state.clone?.remove(); state.clone = null
    hub.classList.remove('sectioned')
    sect.classList.remove('on')
    panel.innerHTML = ''; labelsEl.innerHTML = ''
    state.open = -1
    tiles[i].el.focus({ preventScroll: true })
  }, 950)
}

labelsEl.addEventListener('click', e => {
  const b = e.target.closest('.r-label')
  if (b) select(+b.dataset.k)
})
sect.addEventListener('wheel', e => {
  if (state.open < 0) return
  e.preventDefault()
  select(state.target + (e.deltaY > 0 ? 1 : -1))
}, { passive: false })
document.getElementById('s-back').addEventListener('click', closeSection)

addEventListener('keydown', e => {
  if (booting) { if (e.key === 'Escape' || e.key === ' ') finishBoot(); return }
  if (state.open >= 0) {
    if (e.key === 'Escape') closeSection()
    else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); select(state.target + 1) }
    else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); select(state.target - 1) }
    return
  }
  if (/^[0-9]$/.test(e.key)) { const i = e.key === '0' ? 9 : +e.key - 1; tiles[i].el.focus() }
})

setInterval(() => { clock.textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false }) }, 1000)

let timers = [], booting = false
const at = (ms, fn) => timers.push(setTimeout(fn, ms))
function typeLine(el, text, start, per = 42, keepCaret = false) {
  for (let k = 0; k <= text.length; k++) at(start + k * per, () => {
    el.innerHTML = text.slice(0, k) + (k < text.length || keepCaret ? '<span class="caret"></span>' : '')
  })
  return start + text.length * per
}
function resetBoot() {
  timers.forEach(clearTimeout); timers = []
  boot.className = ''; boot.style.display = ''
  $('b-black').className = ''
  $('b-type').innerHTML = ''; $('b-ident').innerHTML = ''
  $('b-logo').setAttribute('class', ''); $('b-logo').style.opacity = 1
  $('b-brand').className = ''; $('b-brand').style.opacity = 1
  document.querySelectorAll('.brand-line').forEach(l => l.classList.remove('in'))
  $('b-auth').setAttribute('class', '')
  $('b-welcome').className = ''
  hub.classList.remove('in')
  skip.style.display = ''
}
function runBoot() {
  resetBoot(); booting = true
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return finishBoot()
  at(1300, () => $('b-black').classList.add('off'))
  const t1 = typeLine($('b-type'), 'ACCESSING  AUTO-MAS  TERMINAL', 1650)
  at(t1 + 450, () => { $('b-type').innerHTML = ''; $('b-logo').setAttribute('class', 'play') })
  at(t1 + 1900, () => $('b-logo').setAttribute('class', 'play shift'))
  document.querySelectorAll('.brand-line').forEach((l, k) => at(t1 + 2150 + k * 80, () => l.classList.add('in')))
  at(t1 + 3300, () => { $('b-logo').style.opacity = 0; $('b-brand').classList.add('corner') })
  // 身份段
  const ident = $('b-ident')
  const lines = ['ID CONFIRMED : OPERATOR', 'REQUEST RECEIVED', 'START PROCESSING...']
  let t = t1 + 3800
  lines.forEach((txt, k) => {
    const div = document.createElement('div')
    at(t, () => { if (k === 2) div.innerHTML = ''; ident.appendChild(div) })
    t = typeLine(div, txt, t, 38) + 380
    if (k === 2) at(t - 300, () => { div.innerHTML = '<span class="spin"></span>' + txt })
  })
  // 授权段
  at(t + 700, () => { ident.innerHTML = ''; $('b-auth').setAttribute('class', 'play') })
  const tw = t + 700 + 3600
  // 欢迎段：黑白闪切 → 名称黑底扫过 → INTERNAL DATABASE 闪现
  at(tw, () => { $('b-auth').setAttribute('class', ''); boot.classList.add('flash') })
  at(tw + 80, () => boot.classList.remove('flash'))
  at(tw + 160, () => boot.classList.add('flash'))
  at(tw + 240, () => { boot.classList.remove('flash'); $('b-welcome').classList.add('play') })
  at(tw + 1900, () => { $('b-brand').style.opacity = 0; boot.classList.add('leave') })
  at(tw + 2300, () => hub.classList.add('in'))
  at(tw + 2700, () => finishBoot())
}
function finishBoot() {
  timers.forEach(clearTimeout); timers = []
  booting = false
  boot.style.display = 'none'; skip.style.display = 'none'
  hub.classList.add('in')
  focusTile(CENTER)
  tiles[CENTER].el.focus({ preventScroll: true })
}
skip.addEventListener('click', finishBoot)
boot.addEventListener('click', finishBoot)
document.getElementById('replay').addEventListener('click', () => { closeSection(); runBoot() })
runBoot()
</script>
</body>
</html>
