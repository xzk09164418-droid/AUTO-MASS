<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AUTO-MAS 多列档案阵列演示</title>
<link rel="stylesheet" href="../../frontend/public/fonts/misans/misans.css" />
<script type="importmap">{ "imports": { "three": "/frontend/node_modules/three/build/three.module.js" } }</script>
<style>
:root {
  --bg: #e6e3df; --ink: #0b0c0b; --paper: #f6f4f1; --muted: #77756d; --hair: #aaa59a; --accent: #e8701f;
  --font: 'AUTO-MAS MiSans', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font-family: var(--font); color: var(--ink); }
#viewport { position: fixed; inset: 0; overflow: clip; }
#stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; overflow: clip; background: radial-gradient(ellipse at 60% 45%, #f1efeb 0, var(--bg) 70%); }
#gl { position: absolute; inset: 0; width: 1920px; height: 1080px; }
/* 右侧浅色遮罩：保证信息区可读（随抽出淡出） */
.veil { position: absolute; inset: 0; z-index: 1; pointer-events: none; background: linear-gradient(90deg, rgba(230,227,223,0) 44%, rgba(234,231,227,.78) 58%, rgba(234,231,227,.9) 100%), linear-gradient(0deg, rgba(234,231,227,.85) 0, rgba(234,231,227,0) 22%); transition: opacity .4s; }
#stage.detail .veil { opacity: .35; }
.ui { position: absolute; z-index: 5; }
/* 滚动文字（与主演示相同的做法） */
.roll { display: inline-block; position: relative; overflow: hidden; vertical-align: bottom; white-space: nowrap; transition: width .46s cubic-bezier(.2,.8,.2,1); }
.roll > span { display: inline-block; }
.roll > span.out { position: absolute; left: 0; top: 0; }
.brand { left: 80px; top: 96px; line-height: 1.05; }
.brand b { display: block; font-size: 52px; letter-spacing: .02em; }
.brand i { display: block; font-style: normal; font-weight: 700; font-size: 20px; letter-spacing: .02em; }
.brand span { display: block; font-size: 46px; letter-spacing: .08em; }
.brand span em { font-style: normal; font-weight: 700; margin-left: 14px; }
.top-r { right: 80px; top: 108px; display: flex; gap: 40px; align-items: center; font-size: 15px; font-weight: 600; letter-spacing: .08em; }
.top-r kbd { font: 600 11px var(--font); border: 1px solid var(--hair); padding: 1px 6px; margin-left: 10px; color: var(--muted); }
/* 右侧档案信息（参考 RhineLabUI 的 FILE NUMBER 区） */
.info { left: 1010px; top: 470px; width: 900px; }
.info .path { font-size: 12px; font-weight: 600; letter-spacing: .14em; color: var(--muted); }
.info .path b { margin: 0 18px; font-weight: 400; }
.info h1 { margin: 22px 0 0; font-size: 38px; font-weight: 700; letter-spacing: .02em; }
.info .rule { position: relative; margin-top: 46px; height: 1px; background: rgba(11,12,11,.55); }
.info .rule::before { content: ''; position: absolute; left: -6px; top: -3px; width: 6px; height: 6px; background: var(--ink); }
.info .row { display: flex; justify-content: space-between; margin: 26px 0 0 48px; font-size: 18px; font-weight: 600; }
.info .row small { font-size: 11px; letter-spacing: .14em; color: var(--muted); padding-right: 200px; }
.info .sub { margin: 10px 0 0 48px; font-size: 14px; color: var(--muted); letter-spacing: .04em; }
.access { margin: 46px 0 0 48px; display: inline-flex; align-items: center; gap: 120px; font: 600 15px var(--font); letter-spacing: .08em; background: none; border: none; padding: 0; cursor: pointer; color: var(--ink); }
.access i { font-style: normal; font-size: 24px; transition: transform .2s; }
.access:hover i { transform: translateX(8px); }
/* 左下：当前列内序号 */
.sel { left: 80px; top: 880px; }
.sel small { display: block; font-size: 12px; font-weight: 600; letter-spacing: .14em; margin-bottom: 18px; }
.sel .num { font-size: 74px; font-weight: 400; line-height: 1; letter-spacing: .02em; }
.sel .tot { font-size: 30px; color: var(--muted); margin-left: 34px; }
.sel .tot b { font-weight: 400; margin-right: 16px; }
/* 底部中：列内刻度与列切换 */
.ruler { left: 540px; top: 940px; display: flex; align-items: flex-end; gap: 0; }
.ruler .arrow { font-size: 28px; padding: 0 22px; cursor: pointer; user-select: none; line-height: 1; }
.ruler .ticks { display: flex; align-items: flex-end; gap: 22px; height: 30px; padding: 0 8px; }
.ruler .ticks i { width: 2px; height: 12px; background: var(--hair); transition: height .4s cubic-bezier(.2,.8,.2,1), background .4s; }
.ruler .ticks i.on { height: 30px; background: var(--ink); }
.col { left: 1010px; top: 915px; display: flex; align-items: center; gap: 40px; }
.col .arrow { font-size: 26px; cursor: pointer; user-select: none; }
.col small { display: block; font-size: 10px; font-weight: 600; letter-spacing: .14em; color: var(--muted); }
.col div { min-width: 220px; font-size: 15px; font-weight: 600; }
.hint { left: 540px; top: 1006px; font-size: 10px; letter-spacing: .14em; color: var(--muted); }
.powered { right: 80px; top: 932px; font-size: 20px; letter-spacing: .02em; display: flex; align-items: center; gap: 16px; }
.powered::after { content: ''; width: 26px; height: 5px; background: var(--ink); }
.foot { left: 80px; right: 80px; top: 1028px; display: flex; justify-content: space-between; font-size: 10px; font-weight: 600; letter-spacing: .16em; color: var(--muted); }
/* 抽出后的档案卡（沿用二级界面的玻璃档案卡样式） */
#card { right: 80px; top: 150px; width: 760px; height: 760px; padding: 34px 40px; background: linear-gradient(135deg, rgba(255,255,255,.82), rgba(246,244,241,.66)); border: 1px solid rgba(11,12,11,.14); box-shadow: 0 30px 60px -40px rgba(20,20,18,.45); backdrop-filter: blur(8px);
  opacity: 0; transform: translateX(40px); pointer-events: none; transition: opacity .18s, transform .5s cubic-bezier(.2,.8,.2,1); }
#card.on { opacity: 1; transform: none; pointer-events: auto; transition-delay: .25s; }
#card .back { font: 600 13px var(--font); letter-spacing: .1em; background: none; border: none; cursor: pointer; padding: 0; display: flex; align-items: center; gap: 14px; }
#card .back kbd { font: 600 10px var(--font); border: 1px solid var(--hair); padding: 1px 6px; color: var(--muted); }
#card .meta { margin-top: 34px; font-size: 12px; font-weight: 700; letter-spacing: .2em; color: var(--muted); }
#card .meta b { color: var(--accent); margin-right: 14px; }
#card h2 { margin: 14px 0 4px; font-size: 40px; }
#card .zh { font-size: 18px; }
#card .line { margin-top: 22px; height: 2px; background: var(--ink); }
#card .tabs { display: flex; gap: 30px; margin-top: 26px; border-bottom: 1px solid var(--hair); position: relative; }
#card .tabs button { font: 600 15px var(--font); background: none; border: none; padding: 8px 0 10px; color: var(--muted); cursor: pointer; }
#card .tabs button b { font-size: 10px; margin-right: 6px; color: var(--hair); }
#card .tabs button.on { color: var(--ink); } #card .tabs button.on b { color: var(--accent); }
#card .tabs .ul { position: absolute; bottom: -1px; height: 2px; background: var(--ink); transition: left .18s cubic-bezier(.2,.8,.2,1), width .18s cubic-bezier(.2,.8,.2,1); }
#card .kv { display: grid; grid-template-columns: 170px 1fr; margin-top: 18px; }
#card .kv div { padding: 12px 4px; border-bottom: 1px solid rgba(170,165,154,.6); font-size: 15px; }
#card .kv .k { color: var(--muted); font-size: 14px; }
#card .acts { position: absolute; left: 40px; bottom: 30px; display: flex; gap: 10px; }
#card .acts button { font: 700 14px var(--font); letter-spacing: .12em; padding: 10px 22px; border: 1.5px solid var(--ink); background: transparent; cursor: pointer; }
#card .acts button:first-child { background: var(--ink); color: var(--paper); }
#stage.detail .info, #stage.detail .col, #stage.detail .ruler, #stage.detail .sel, #stage.detail .hint { opacity: 0; pointer-events: none; }
.info, .col, .ruler, .sel, .hint { transition: opacity .25s; }
</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <canvas id="gl" width="1920" height="1080"></canvas>
  <div class="veil"></div>
  <div class="ui brand"><b>AUTO-MAS</b><i>SCRIPT CUSTODY INFORMATION</i><span>ANALYSIS<em>OS</em></span></div>
  <div class="ui top-r"><span>⌕&nbsp; ARCHIVE INDEX<kbd>/</kbd></span><span>+ &nbsp;SAVED&nbsp; 00</span><span>◷</span></div>

  <div class="ui info">
    <div class="path">INTERNAL DATABASE<b>/</b><span id="i-col"></span></div>
    <h1>FILE NUMBER: <span id="i-num"></span></h1>
    <div class="rule"></div>
    <div class="row"><span id="i-name"></span><small>REFERENCE AREA</small></div>
    <div class="sub" id="i-sub"></div>
    <button class="access" id="access" type="button">ACCESS FILE <i>→</i></button>
  </div>

  <div class="ui sel"><small>ARCHIVE / SELECT</small><span class="num" id="s-num"></span><span class="tot"><b>/</b><span id="s-tot"></span></span></div>
  <div class="ui ruler"><span class="arrow" id="up">↑</span><span class="ticks" id="ticks"></span><span class="arrow" id="down">↓</span></div>
  <div class="ui col"><span class="arrow" id="left">←</span><div><small id="c-idx"></small><span id="c-name"></span></div><span class="arrow" id="right">→</span></div>
  <div class="ui hint">← → 切换脚本列 &nbsp; / &nbsp; ↑ ↓ 或滚轮 前后账号 &nbsp; / &nbsp; ENTER 读取 &nbsp; / &nbsp; ESC 返回</div>
  <div class="ui powered">POWERED BY <b>AUTO-MAS</b></div>
  <div class="ui foot"><span>■ &nbsp; SESSION AUTHORIZED</span><span><span id="clock"></span> &nbsp; / &nbsp; REINITIALIZE ↗</span></div>

  <div class="ui" id="card">
    <button class="back" id="back" type="button">← &nbsp;ARCHIVE OVERVIEW <kbd>ESC</kbd></button>
    <div class="meta"><b id="d-code"></b><span id="d-path"></span></div>
    <h2 id="d-name"></h2>
    <div class="zh" id="d-zh"></div>
    <div class="line"></div>
    <div class="tabs" id="d-tabs"><button class="on" type="button"><b>01</b>账号</button><button type="button"><b>02</b>脚本</button><button type="button"><b>03</b>记录</button><i class="ul"></i></div>
    <div class="kv" id="d-kv"></div>
    <div class="acts"><button type="button">保存</button><button type="button">立即运行</button></div>
  </div>
</div></div>

<script type="module">
import * as THREE from 'three'

const stage = document.getElementById('stage')
const fit = () => { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `translate(-50%, -50%) scale(${s})` }
addEventListener('resize', fit); fit()
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches
const $ = id => document.getElementById(id)

// ── 演示数据：列 = 通用脚本，列内 = 该脚本下的账号（第 1 张为脚本本身） ──
const COLS = [
  { name: 'BGI 每日', en: 'GENERAL · RDP', accounts: ['主号', '小号', '测试号'] },
  { name: '鸣潮日常', en: 'GENERAL', accounts: ['鸣潮主号'] },
  { name: '星铁清体力', en: 'GENERAL', accounts: ['星铁', '星铁小号'] },
  { name: '绝区零一条龙', en: 'GENERAL', accounts: ['主号', '小号', '活动号'] },
  { name: 'MaaEnd 每日', en: 'GENERAL', accounts: ['博士'] },
  { name: '米游社签到', en: 'GENERAL', accounts: ['用户 1', '用户 2'] },
].map(c => ({ ...c, items: [{ kind: 'script', name: c.name }, ...c.accounts.map(a => ({ kind: 'user', name: a }))] }))
const C = COLS.length
const mod = (a, n) => ((a % n) + n) % n

// ── 滚动文字 ──
function roll(el, text, dir = 1) {
  text = String(text)
  if (el.dataset.v === text) return
  const first = el.dataset.v === undefined
  el.dataset.v = text
  el.classList.add('roll')
  if (first || REDUCE) { el.innerHTML = ''; const n = document.createElement('span'); n.textContent = text; el.appendChild(n); el.style.width = ''; return }
  const w0 = el.offsetWidth, old = [...el.children]
  const n = document.createElement('span'); n.textContent = text; el.appendChild(n)
  const ease = 'cubic-bezier(.2,.8,.2,1)'
  old.forEach(o => {
    o.classList.add('out'); o.setAttribute('aria-hidden', 'true'); o.getAnimations().forEach(a => a.cancel())
    o.animate([{ transform: 'none', opacity: 1, filter: 'blur(0)' }, { transform: `translateY(${-100 * dir}%)`, opacity: 0, filter: 'blur(2px)' }], { duration: 460, easing: ease, fill: 'forwards' }).onfinish = () => o.remove()
    setTimeout(() => o.isConnected && o.remove(), 520)
  })
  const w1 = n.offsetWidth
  el.style.width = w0 + 'px'; void el.offsetWidth; el.style.width = w1 + 'px'
  n.animate([{ transform: `translateY(${100 * dir}%)`, opacity: 0, filter: 'blur(2px)' }, { transform: 'none', opacity: 1, filter: 'blur(0)' }], { duration: 460, easing: ease })
}

// ── Three.js 场景 ──
const canvas = $('gl')
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'low-power' })
renderer.setClearColor(0x000000, 0)
renderer.outputColorSpace = THREE.SRGBColorSpace
const scene = new THREE.Scene()
scene.fog = new THREE.Fog(0xe6e3df, 14, 30)
const camera = new THREE.PerspectiveCamera(26, 1920 / 1080, 1, 80)
scene.add(new THREE.AmbientLight(0xffffff, 1.7))
const sun = new THREE.DirectionalLight(0xffffff, 1.3); sun.position.set(-8, 14, 4); scene.add(sun)

// 档案板：0.26 厚 × 1.7 高 × 2.6 长，长边沿 z；同一列的档案沿 x 依次排开，列沿 z 向远处排开
const BOX = new THREE.BoxGeometry(0.26, 1.7, 2.6)
const FACE = new THREE.PlaneGeometry(2.5, 1.6)
const EDGE = new THREE.EdgesGeometry(BOX)
const ROW_GAP = 0.46, COL_GAP = 3.25
const texCache = new Map()
function faceTex(ci, ri) {
  const key = ci + ':' + ri
  if (texCache.has(key)) return texCache.get(key)
  const c = document.createElement('canvas'); c.width = 512; c.height = 328
  const g = c.getContext('2d'), it = COLS[ci].items[ri]
  g.fillStyle = 'rgba(255,255,255,0.32)'; g.fillRect(12, 12, 488, 304)
  g.strokeStyle = 'rgba(40,40,36,0.25)'; g.lineWidth = 2; g.strokeRect(12, 12, 488, 304)
  // 档案章
  g.fillStyle = it.kind === 'script' ? 'rgba(20,20,18,0.88)' : 'rgba(60,60,56,0.7)'; g.fillRect(40, 90, 140, 140)
  g.save(); g.translate(55, 105); g.scale(2.75, 2.75); g.strokeStyle = '#fff'; g.lineWidth = 2.6
  g.stroke(new Path2D('M9 2H38V26M26 38H2V9L9 2')); g.lineWidth = 3.25; g.stroke(new Path2D('M10 31 20 9 30 31M14.5 23H25.5'))
  g.fillStyle = '#e8701f'; g.fillRect(31, 31, 7, 7); g.restore()
  g.fillStyle = 'rgba(20,20,18,0.85)'; g.font = '700 26px "AUTO-MAS MiSans", "Microsoft YaHei", sans-serif'
  g.fillText(`X-002-${String(ci + 1).padStart(2, '0')}${ri ? '·' + String(ri).padStart(2, '0') : ''}`, 210, 130)
  g.font = '700 34px "AUTO-MAS MiSans", "Microsoft YaHei", sans-serif'
  g.fillText(it.name.length > 8 ? it.name.slice(0, 8) + '…' : it.name, 210, 182)
  g.fillStyle = 'rgba(20,20,18,0.45)'; g.fillRect(210, 202, 200, 3)
  g.font = '600 18px "AUTO-MAS MiSans", "Microsoft YaHei", sans-serif'; g.fillText(it.kind === 'script' ? 'SCRIPT CONFIG' : 'ACCOUNT', 210, 236)
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4
  texCache.set(key, t); return t
}
// 只画当前附近的窗口：列 ±2、行 ±9；数据按周期取模，首尾自然衔接成无缝循环
const WC = 2, WR = 9
const slots = []
for (let dc = -WC; dc <= WC; dc++) for (let dr = -WR; dr <= WR; dr++) {
  const root = new THREE.Group()
  const body = new THREE.Mesh(BOX, new THREE.MeshStandardMaterial({ color: 0xf1efea, roughness: 0.4, transparent: true, opacity: 0.86 }))
  const face = new THREE.Mesh(FACE, new THREE.MeshBasicMaterial({ transparent: true }))
  face.rotation.y = Math.PI / 2; face.position.x = 0.135
  const edge = new THREE.LineSegments(EDGE, new THREE.LineBasicMaterial({ color: 0x9e9a90, transparent: true, opacity: 0.5 }))
  root.add(body, face, edge); scene.add(root)
  slots.push({ dc, dr, root, body, face, edge, lift: 0, key: '' })
}

// ── 状态：列与列内位置都是连续量，阻尼追随整数目标（目标不取模，越界自然循环） ──
let colT = 0, colP = 0
const rowT = COLS.map(() => 0), rowP = COLS.map(() => 0)      // 每列记住自己的选择
let waveT = 9, waveOrigin = { c: 0, r: 0 }
let hovered = null, detail = 0, detailT = 0
const cur = () => mod(colT, C)
const curRow = () => mod(rowT[cur()], COLS[cur()].items.length)

function layoutSlot(s, t, dt) {
  const ccont = Math.round(colP) + s.dc                       // 连续列号
  const ci = mod(ccont, C), col = COLS[ci], n = col.items.length
  const rp = rowP[ci], rcont = Math.round(rp) + s.dr
  const ri = mod(rcont, n)
  const key = ci + ':' + ri
  if (s.key !== key) { s.face.material.map = faceTex(ci, ri); s.face.material.needsUpdate = true; s.key = key; s.ci = ci; s.ri = ri }
  const x = (rcont - rp) * ROW_GAP, z = -(ccont - colP) * COL_GAP
  const selected = ci === cur() && ri === curRow() && Math.abs(ccont - colT) < 0.5 && Math.abs(rcont - rowT[ci]) < 0.5
  // 选中抬起 0.4；抽出时升到 3.35；悬停 0.28；选择变化时从选中处向外扩散一圈波浪
  const target = selected ? 0.4 + detail * 2.95 : (hovered === s ? 0.28 : 0)
  s.lift += (target - s.lift) * Math.min(1, dt * (selected ? 4.2 : 6))
  const dist = Math.hypot((ccont - colT) * 1.6, rcont - rowT[ci] + (ci === cur() ? 0 : 0))
  const wave = REDUCE ? 0 : 0.22 * Math.sin(waveT * 9 - dist * 1.25) * Math.exp(-waveT * 2.2) * Math.exp(-dist * 0.28) * (waveT * 9 > dist * 1.25 ? 1 : 0)
  s.root.position.set(x, s.lift + (selected ? 0 : wave), z)
  s.root.rotation.y = selected ? -detail * 0.55 : 0
  const fade = Math.max(0, 1 - Math.max(0, Math.abs(z) - 4) / 5) * Math.max(0, 1 - Math.max(0, Math.abs(x) - 2.6) / 1.8)
  s.root.visible = fade > 0.02 && (detail < 0.5 || selected || true)
  const dim = detail > 0 && !selected ? 1 - detail * 0.75 : 1
  s.body.material.opacity = (selected ? 0.92 : 0.8) * fade * dim
  s.face.material.opacity = fade * dim
  s.edge.material.opacity = (selected ? 1 : 0.45) * fade * dim
  s.edge.material.color.setHex(selected ? 0xe8701f : 0x9e9a90)
  s.ccont = ccont; s.rcont = rcont
  return selected
}

const camBase = new THREE.Vector3(8.6, 6.4, 7.8), look = new THREE.Vector3(0.4, 0.2, -1.2)
let last = 0, running = false
function frame(t) {
  const dt = last ? Math.min(0.05, (t - last) / 1000) : 1 / 60
  last = t
  const k = 1 - Math.pow(0.004, dt)
  colP += (colT - colP) * k
  COLS.forEach((_, i) => { rowP[i] += (rowT[i] - rowP[i]) * k })
  detail += (detailT - detail) * (1 - Math.pow(0.02, dt))
  waveT += dt
  // 抽出时镜头转向，把档案放到画面左侧
  camera.position.set(camBase.x - detail * 3.2, camBase.y + detail * 1.2, camBase.z - detail * 1.5)
  camera.lookAt(look.x - detail * 0.6, look.y + detail * 2.8, look.z + detail * 1.8)
  for (const s of slots) layoutSlot(s, t, dt)
  renderer.render(scene, camera)
  return Math.abs(colT - colP) > 0.001 || rowP.some((p, i) => Math.abs(rowT[i] - p) > 0.001) || Math.abs(detailT - detail) > 0.002 || waveT < 2.5
}
// 按需绘制：有运动时逐帧，静止后停下；交互后再保持 1.2 秒，让抬起 / 悬停的余量画完
let keepAlive = 0
function tick(t) {
  const moving = frame(t)
  if (moving || performance.now() < keepAlive) requestAnimationFrame(tick)
  else { running = false; last = 0 }
}
function wake() { if (!running) { running = true; requestAnimationFrame(tick) } }
function poke() { keepAlive = performance.now() + 1200; wake() }

// ── 文字区 ──
let lastDir = 1
function updateText(dir) {
  const ci = cur(), col = COLS[ci], ri = curRow(), it = col.items[ri]
  roll($('i-col'), '托管管理 · ' + col.name, dir)
  roll($('i-num'), `X-002-${String(ci + 1).padStart(2, '0')}${ri ? '·' + String(ri).padStart(2, '0') : ''}`, dir)
  roll($('i-name'), it.kind === 'script' ? col.name + ' · 脚本配置' : it.name, dir)
  roll($('i-sub'), it.kind === 'script' ? `${col.en} · ${col.accounts.length} 个账号` : `所属脚本：${col.name}`, dir)
  roll($('s-num'), String(ri + 1).padStart(2, '0'), dir)
  roll($('s-tot'), String(col.items.length).padStart(2, '0'), dir)
  roll($('c-idx'), `COLUMN ${String(ci + 1).padStart(2, '0')} / ${String(C).padStart(2, '0')}`, dir)
  roll($('c-name'), col.name, dir)
  const ticks = $('ticks')
  while (ticks.children.length < col.items.length) ticks.appendChild(document.createElement('i'))
  while (ticks.children.length > col.items.length) ticks.lastChild.remove()
  ;[...ticks.children].forEach((t, i) => t.classList.toggle('on', i === ri))
}
function moveRow(d) { if (detailT) return; rowT[cur()] += d; waveT = 0; updateText(d); poke() }
function moveCol(d) { if (detailT) return; colT += d; waveT = 0; updateText(d); poke() }

// ── 抽出与档案卡 ──
function openDetail() {
  const ci = cur(), col = COLS[ci], ri = curRow(), it = col.items[ri]
  $('d-code').textContent = `X-002-${String(ci + 1).padStart(2, '0')}${ri ? '·' + String(ri).padStart(2, '0') : ''}`
  $('d-path').textContent = '托管管理 / ' + col.name
  $('d-name').textContent = it.kind === 'script' ? col.name : it.name
  $('d-zh').textContent = it.kind === 'script' ? '脚本配置 · ' + col.en : '账号 · 所属脚本 ' + col.name
  const rows = it.kind === 'script'
    ? [['启动程序', 'D:\\Tools\\' + col.name + '.exe'], ['成功判定', '日志 · 关键字'], ['单次运行时限', '60 分钟'], ['账号数', col.accounts.length + ' 个']]
    : [['名称', it.name], ['启用', '开'], ['剩余天数', '永久'], ['配置来源', '独立'], ['上次代理', '今天 06:12']]
  $('d-kv').innerHTML = rows.map(([k, v]) => `<div class="k">${k}</div><div>${v}</div>`).join('')
  detailT = 1; stage.classList.add('detail'); $('card').classList.add('on'); moveUl(); poke()
}
function closeDetail() { if (!detailT) return; detailT = 0; stage.classList.remove('detail'); $('card').classList.remove('on'); poke() }
function moveUl() {
  const on = $('d-tabs').querySelector('button.on'), ul = $('d-tabs').querySelector('.ul')
  ul.style.left = on.offsetLeft + 'px'; ul.style.width = on.offsetWidth + 'px'
}
$('d-tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; [...$('d-tabs').querySelectorAll('button')].forEach(x => x.classList.toggle('on', x === b)); moveUl() })

// ── 输入 ──
addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); moveRow(1) }
  else if (e.key === 'ArrowUp') { e.preventDefault(); moveRow(-1) }
  else if (e.key === 'ArrowRight') { e.preventDefault(); moveCol(1) }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); moveCol(-1) }
  else if (e.key === 'Enter') openDetail()
  else if (e.key === 'Escape') closeDetail()
})
let wheelAt = 0
stage.addEventListener('wheel', e => {
  e.preventDefault()
  const now = performance.now()
  if (now - wheelAt < 90) return
  wheelAt = now
  if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) moveCol((e.deltaX || e.deltaY) > 0 ? 1 : -1)
  else moveRow(e.deltaY > 0 ? 1 : -1)
}, { passive: false })
$('up').onclick = () => moveRow(-1); $('down').onclick = () => moveRow(1)
$('left').onclick = () => moveCol(-1); $('right').onclick = () => moveCol(1)
$('access').onclick = openDetail; $('back').onclick = closeDetail

// 点击档案：同列跳到该行，跨列先切列；点已选中的直接读取
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2()
function hit(e) {
  const r = canvas.getBoundingClientRect()
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1)
  ray.setFromCamera(ndc, camera)
  const h = ray.intersectObjects(slots.filter(s => s.root.visible).map(s => s.body))[0]
  return h ? slots.find(s => s.body === h.object) : null
}
canvas.addEventListener('pointermove', e => { if (detailT) return; const s = hit(e); if (s !== hovered) { hovered = s; canvas.style.cursor = s ? 'pointer' : 'default'; poke() } })
canvas.addEventListener('click', e => {
  if (detailT) return
  const s = hit(e); if (!s) return
  const dc = s.ccont - colT, dr = s.rcont - rowT[s.ci]
  if (dc === 0 && dr === 0) { openDetail(); return }
  if (dc !== 0) { colT += dc; rowT[s.ci] = s.rcont; waveT = 0; updateText(dc > 0 ? 1 : -1); poke() }
  else moveRow(dr)
})

setInterval(() => { $('clock').textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false }) }, 1000)
updateText(1)
poke()
window.__array = { moveRow, moveCol, openDetail, closeDetail, state: () => ({ col: cur(), row: curRow(), colT, rowT: [...rowT] }) }
</script>
</body>
</html>
