<body>
<div id="viewport"><div id="stage" data-mode="archive">

  <nav class="system-nav" aria-label="系统导航">
    <button type="button"><span class="nav-glyph">⌕</span> ARCHIVE INDEX <span class="key">/</span></button>
    <button type="button">＋ SAVED <span>00</span></button>
    <button type="button" aria-label="系统设置"><span class="settings-glyph">◷</span></button>
  </nav>
  <section class="archive-ui" aria-label="档案选择">

      <div class="eyebrow">INTERNAL DATABASE <span>／</span> <span id="archive-category"></span></div>
      <button class="file-title" type="button" data-action="open">FILE NUMBER: <span id="selected-id"></span><span class="file-open">↗</span></button>

    <div class="archive-navigation"><button type="button" data-action="prev" aria-label="上一个档案">↑</button><div id="file-ticks" class="file-ticks"></div><button type="button" data-action="next" aria-label="下一个档案">↓</button></div>
    <div class="column-navigation"><button type="button" data-action="column-prev" aria-label="上一列">←</button><div><span id="column-number"></span><strong id="column-name"></strong></div><button type="button" data-action="column-next" aria-label="下一列">→</button></div>
    <div class="archive-hint"><kbd>←</kbd> <kbd>→</kbd> 切换列 <span>／</span> <kbd>↑</kbd> <kbd>↓</kbd> 前后档案 <span>／</span> <kbd>ENTER</kbd> 读取</div>

  <div id="loading" class="loading">CONNECTING TO INTERNAL DATABASE</div>
</div></div>

<script type="module">
import * as THREE from 'three'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js'
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js'
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js'
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js'

const stage = document.getElementById('stage')
const $ = id => document.getElementById(id)
const fit = () => { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `translate(-50%, -50%) scale(${s})` }
addEventListener('resize', fit); fit()
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches

// ── 数据：五列 = 五个通用脚本；列内 = 脚本配置 + 各账号（演示数据） ──
const COLUMNS = [
  { name: 'BGI 每日', en: 'BETTERGI DAILY', accounts: ['主号', '小号', '测试号', '活动号', '备用号', '双开号', '旧号'] },
  { name: '鸣潮日常', en: 'WUTHERING DAILY', accounts: ['鸣潮主号', '鸣潮小号', '声骸号', '体力号', '备用号', '旧号', '活动号'] },
  { name: '星铁清体力', en: 'STAR RAIL STAMINA', accounts: ['星铁', '星铁小号', '模拟宇宙', '忘却之庭', '备用号', '旧号', '活动号'] },
  { name: '绝区零一条龙', en: 'ZZZ ONE-DRAGON', accounts: ['主号', '小号', '活动号', '式舆防卫', '备用号', '旧号', '双开号'] },
  { name: 'MaaEnd 每日', en: 'MAAEND DAILY', accounts: ['博士', '博士 B', '基建号', '剿灭号', '备用号', '旧号', '活动号'] },
]
const records = []
COLUMNS.forEach((col, lane) => {
  ;[null, ...col.accounts].forEach((acc, k) => {
    records.push({
      id: 'X-' + String(records.length + 1).padStart(3, '0'), lane, k,
      title: acc || col.name, en: acc ? col.en + ' / ' + String(k).padStart(2, '0') : col.en,
      category: col.name, kind: acc ? '账号' : '脚本配置',
      clearance: acc ? (k % 4 === 3 ? 'DISABLED' : 'ACTIVE') : 'SCRIPT CONFIG',
      last: acc ? ['今天 06:12', '昨天 18:40', '11-18', '—'][k % 4] : '—',
      remained: acc ? ['永久', '30 天', '12 天', '永久'][k % 4] : '—',
      base: acc ? ['独立', '共享', '原生', '独立'][k % 4] : '—',
    })
  })
})
const columnFiles = lane => records.map((r, i) => ({ r, i })).filter(x => x.r.lane === lane).map(x => x.i)

// ── 原项目的运动函数（motion.ts） ──
const smooth = t => { t = Math.max(0, Math.min(1, t)); return t * t * t * (10 + t * (-15 + 6 * t)) }
const ease = t => { t = Math.max(0, Math.min(1, t)); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2 }
const bell = (x, w) => Math.exp(-0.5 * (x / w) ** 2)
function settlingWave(distance, time) {
  const age = time - 25.05 - Math.abs(distance) * 0.065
  const envelope = Math.max(-0.42, 2.15 - 0.17 * (Math.sqrt(distance * distance + 1) - 1))
  const rise = smooth(age / 0.62)
  const ring = age > 0 ? Math.sin(age * 5.1) * Math.exp(-age * 1.3) : 0
  return envelope * (rise + 0.18 * ring * smooth(age / 0.16))
}
function baselineSelectionWave(distance, age) {
  if (age < 0 || age > 3.2) return 0
  return 0.8 * smooth(age / 0.2) * Math.exp(-age * 1.15) * Math.cos((distance - age * 8) * 0.58) * bell(distance - age * 8, 3.4)
}
const columnStrength = (lane, focus) => 0.25 + 0.75 * bell(lane - focus, 0.55)
const idleWave = (row, lane, time) => 0.075 * Math.sin((time * Math.PI * 2) / 8 + row * 0.3 - lane * 0.45) + 0.027 * Math.sin((time * Math.PI * 2) / 13 - row * 0.17 + lane * 0.3)
function damp(s, target, rate, dt) {
  const delta = s.value - target, impulse = s.velocity + rate * delta, decay = Math.exp(-rate * dt)
  s.value = target + (delta + impulse * dt) * decay
  s.velocity = (s.velocity - rate * impulse * dt) * decay
}
const INSPECTION_LIFT = 4.05
const COLUMN_SPACING = 5.2, ROW_SPACING = 0.62
const wrap = (v, n) => ((v % n) + n) % n
const fileAtCell = ({ lane, row }) => { const f = columnFiles(wrap(lane, COLUMNS.length)); return f[wrap(row - 12, f.length)] }
const cellPosition = c => new THREE.Vector3((c.lane - 2) * COLUMN_SPACING, -4.6, (c.row - 15.5) * ROW_SPACING)

// ── 渲染器、灯光、雾、地面（archive-lighting.ts / scene.ts，baseline 配置） ──
const container = $('scene')
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' })
const PR = Math.min(devicePixelRatio, 1.5)
renderer.setPixelRatio(PR)
renderer.setSize(1920, 1080, false)
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.PCFSoftShadowMap
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.05
container.appendChild(renderer.domElement)
const scene = new THREE.Scene()
scene.background = new THREE.Color('#eae5e1')
scene.fog = new THREE.Fog('#eae5e1', 22, 47)
const pmrem = new THREE.PMREMGenerator(renderer)
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture
scene.environmentIntensity = 0.48
scene.add(new THREE.HemisphereLight('#fffaf5', '#b4a18c', 0.65))
const key = new THREE.DirectionalLight('#fff7ed', 1.4)
key.position.set(-6, 14, -5)
const fill = new THREE.DirectionalLight('#ffffff', 0.6)
fill.position.set(7, 8, -10)
scene.add(key, fill)
key.castShadow = true
Object.assign(key.shadow.camera, { left: -16, right: 16, top: 15, bottom: -15, near: 0.1, far: 45 })
key.shadow.mapSize.set(2048, 2048)
key.shadow.normalBias = 0.035
key.shadow.bias = -0.0003
key.shadow.radius = 4
const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: '#d8c9b9', roughness: 0.95 }))
floor.rotation.x = -Math.PI / 2
floor.position.y = -4.63
floor.receiveShadow = true
scene.add(floor)
const camera = new THREE.PerspectiveCamera(6.15, 16 / 9, 5, 300)
camera.position.set(-62.26, 35.98, 43.28)
const cameraAim = new THREE.Vector3(-0.5, 1.1, 0.4)
camera.lookAt(cameraAim)
const composer = new EffectComposer(renderer)
composer.setPixelRatio(PR)
composer.setSize(1920, 1080)
composer.addPass(new RenderPass(scene, camera))
const bokeh = new BokehPass(scene, camera, { focus: 25, aperture: 0.0003, maxblur: 0.011 })
composer.addPass(bokeh)
composer.addPass(new OutputPass())

// ── 档案标签：版式与原项目相同，内容换成 AUTO-MAS（标志为 AUTO-MAS 档案章 + 圆环标志） ──
const labelCanvas = document.createElement('canvas')

const labelMark = new Image()

// ── 模型：阵列用实例化的外壳 / 边 / 紧固件 / 索引 / 漫射层，选中的那一份用完整材质 ──
const model = new THREE.Group()
const instances = []
const palettes = new Map()
const MAX = 7 * 40
let labelMesh = null
async function load() {
  await labelMark.decode().catch(() => {})
  const gltf = await new GLTFLoader().loadAsync('assets/archive-cassette.glb')
  gltf.scene.updateMatrixWorld(true)
  const meshes = []
  gltf.scene.traverse(o => { if (o.isMesh) meshes.push(o) })
  for (const mesh of meshes) {
    const geom = mesh.geometry.clone().applyMatrix4(mesh.matrixWorld)
    const name = mesh.material.name.replace(/\.\d+$/, '')
    const mat = mesh.material.clone()
    mat.envMapIntensity = 0.6
    if (name === 'Frosted_Polymer') { mat.color.set('#fffdfa'); mat.transmission = 0.9; mat.thickness = 0.12; mat.roughness = 0.21; mat.ior = 1.46; mat.attenuationColor = new THREE.Color('#eee6df'); mat.attenuationDistance = 2 }
    if (name === 'Internal_Ceramic') { mat.color.set('#c7beb6'); mat.roughness = 0.6 }
    if (name === 'Printed_Label') mat.color.set('#eae5dc')
    if (name === 'Ivory_Edges') { mat.color.set('#f0e7df'); mat.roughness = 0.31; mat.transmission = 0.65; mat.thickness = 0.04 }
    if (name === 'Optical_Diffuser') { mat.color.set('#e2dad4'); mat.transmission = 0; mat.roughness = 0.7 }
    if (name === 'Subsurface_Optics') { mat.color.set('#b9aba1'); mat.roughness = 0.48; mat.metalness = 0.05 }
    if (name === 'Optical_Edges') { mat.transmission = 0; mat.color.set('#d4c7be'); mat.roughness = 0.26; mat.metalness = 0.08 }
    const optics = { Optical_Glass_Body: ['#929894', .38, .27], Optical_Glass_Roof: ['#929b94', .34, .42], Optical_Glass_Edge: ['#edf0e7', .19, .9], Optical_Bridge_Glass: ['#a0aca2', .32, .36] }[name]
    if (optics) { mat.color.set(optics[0]); mat.roughness = optics[1]; mat.transparent = true; mat.opacity = optics[2]; mat.transmission = 0; mat.depthWrite = false }
    if (name === 'Carbon_Ink') continue
    const sel = new THREE.Mesh(geom, mat)
    sel.userData.surface = name
    sel.castShadow = name === 'Optical_Diffuser'
    sel.receiveShadow = true
    model.add(sel)
    if (!['Frosted_Polymer', 'Ivory_Edges', 'Titanium_Fasteners', 'Index_Inlay', 'Optical_Diffuser'].includes(name)) { palettes.set(name, { high: mat }); continue }
    const arrayMat = mat.clone()
    if (name === 'Frosted_Polymer') {
      arrayMat.transmission = 0.78
      arrayMat.transparent = false
      arrayMat.color.set('#fff7ed')
      arrayMat.onBeforeCompile = shader => {
        shader.vertexShader = 'varying float vPanelHeight;\n' + shader.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\nvPanelHeight = position.y / 3.7;')
        shader.fragmentShader = 'varying float vPanelHeight;\n' + shader.fragmentShader.replace('#include <color_fragment>', '#include <color_fragment>\ndiffuseColor.rgb *= mix(vec3(0.40, 0.30, 0.20), vec3(1.0, 0.98, 0.94), smoothstep(0.1, 1.0, vPanelHeight));')
      }
      arrayMat.roughness = 0.28
      arrayMat.clearcoat = 0.3
      arrayMat.clearcoatRoughness = 0.25
    }
    if (name === 'Optical_Diffuser') arrayMat.color.set('#806447')
    if (name === 'Ivory_Edges') { arrayMat.transmission = 0; arrayMat.color.set('#fff5e9'); arrayMat.roughness = 0.38 }
    if (name === 'Index_Inlay') { arrayMat.color.set('#e4d6c5'); arrayMat.metalness = 0.05 }
    palettes.set(name, { high: mat, low: arrayMat })
    const inst = new THREE.InstancedMesh(geom, arrayMat, MAX)
    inst.instanceMatrix.setUsage(THREE.DynamicDrawUsage)
    inst.castShadow = name === 'Optical_Diffuser'
    inst.receiveShadow = true
    inst.frustumCulled = false
    instances.push(inst)
    scene.add(inst)
  }
  labelMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.99, 0.46), new THREE.MeshBasicMaterial({ map: labelTexture, toneMapped: false, transparent: true, depthWrite: false }))
  labelMesh.position.set(-1.36, 3.04, 0.255)
  model.add(labelMesh)
  scene.add(model)
}
// 选中档案的外观：外壳、边等在阵列材质与完整材质之间插值；内部结构随抬起渐显
function applyAppearance(q) {
  for (const child of model.children) {
    if (child === labelMesh) { child.material.opacity = q; continue }
    const p = palettes.get(child.userData.surface)
    if (!p) continue
    if (!p.low) {
      const m = child.material
      if (m.userData.base === undefined) { m.userData.base = m.transparent ? m.opacity : 1; m.userData.baseTransparent = m.transparent }
      // 渐显期间半透明；抬起完成后恢复为不透明，玻璃的透射才能折射出内部结构
      const done = q > 0.995
      const wantTransparent = done ? m.userData.baseTransparent : true
      if (m.transparent !== wantTransparent) { m.transparent = wantTransparent; m.needsUpdate = true }
      m.opacity = done ? m.userData.base : m.userData.base * q
      child.visible = q > 0.02
      continue
    }
    if (!child.userData.mixed) { child.material = p.high.clone(); child.userData.mixed = true }
    const m = child.material
    m.color.copy(p.low.color).lerp(p.high.color, q)
    m.roughness = THREE.MathUtils.lerp(p.low.roughness, p.high.roughness, q)
    m.transmission = THREE.MathUtils.lerp(p.low.transmission ?? 0, p.high.transmission ?? 0, q)
  }
}

// 解密：玻璃从磨砂过渡到清晰，露出内部双环结构（数值取自原项目 CardAppearance.setClarity）
let clarity = 0
function applyClarity(c) {
  for (const child of model.children) {
    if (child.userData.surface !== 'Frosted_Polymer' || !child.userData.mixed) continue
    const p = palettes.get('Frosted_Polymer'), m = child.material, q = ease(lift.value / 0.4)
    const base = k => THREE.MathUtils.lerp(p.low[k] ?? p.high[k], p.high[k], q)
    m.thickness = THREE.MathUtils.lerp(base('thickness'), 0.018, c)
    m.transmission = THREE.MathUtils.lerp(base('transmission'), 0.985, c)
    m.attenuationDistance = THREE.MathUtils.lerp(base('attenuationDistance'), 8, c)
    m.roughness = THREE.MathUtils.lerp(m.roughness, 0.025, c)
  }
}

// ── 状态 ──
let selected = fileAtCell({ lane: 2, row: 12 })
let selectedCell = { lane: 2, row: 12 }
const laneMemory = new Map()          // 每列记住上次的行
const lift = { value: 0, velocity: 0 }, rail = { value: 0, velocity: 0 }, shoulder = { value: 12, velocity: 0 }
const laneFocus = { value: 2, velocity: 0 }, columnCamera = { value: 0, velocity: 0 }
let pulses = [], detail = 0, targetDetail = 0, lastInteraction = 0, idleGain = 0, pulseGain = 1, clock = 0
let hoverCell = null
const hoverLifts = new Map()
const dummy = new THREE.Object3D()
let drawnCells = []
const cellKey = c => c.lane + ':' + c.row

function select(navigation) {
  lastInteraction = clock
  const prev = { ...selectedCell }
  if (navigation.axis === 'row') selectedCell = { lane: selectedCell.lane, row: selectedCell.row + navigation.direction }
  else if (navigation.axis === 'lane') {
    laneMemory.set(wrap(selectedCell.lane, COLUMNS.length), selectedCell.row)
    const lane = selectedCell.lane + navigation.direction
    const remembered = laneMemory.get(wrap(lane, COLUMNS.length))
    selectedCell = { lane, row: remembered ?? selectedCell.row }
  } else selectedCell = { ...navigation.cell }
  if (prev.lane === selectedCell.lane && prev.row === selectedCell.row) return
  selected = fileAtCell(selectedCell)
  lift.value = 0; lift.velocity = 0
  pulses.push({ ...selectedCell, time: clock }); pulses = pulses.slice(-6)
  drawLabel(selected)
  updateText(navigation.direction || 1)
  wake()
}

// ── 每帧 ──
const VIEW_SPAN = 7.33, ARRAY_DISTANCE = 140, DETAIL_DISTANCE = 72
const yaw = THREE.MathUtils.degToRad(59), elevation = THREE.MathUtils.degToRad(19)
const baseDirection = new THREE.Vector3(-Math.sin(yaw) * Math.cos(elevation), Math.sin(elevation), Math.cos(yaw) * Math.cos(elevation))
const arrayAim = new THREE.Vector3(-1.091, -0.045, 0.481)
let last = 0
function update(time) {
  const dt = Math.min(0.05, last ? time - last : 0.016)
  last = time; clock = time
  const hoverKey = hoverCell ? cellKey(hoverCell) : null
  if (hoverKey && !hoverLifts.has(hoverKey)) hoverLifts.set(hoverKey, 0)
  for (const [k, v] of hoverLifts) {
    const t = k === hoverKey ? 0.28 : 0, n = THREE.MathUtils.lerp(v, t, 1 - Math.exp(-dt * 14))
    if (t === 0 && n < 0.0001) hoverLifts.delete(k); else hoverLifts.set(k, n)
  }
  const hoverLift = c => hoverLifts.get(cellKey(c)) ?? 0
  const chosen = cellPosition(selectedCell)
  damp(shoulder, selectedCell.row, 5, dt)
  damp(laneFocus, selectedCell.lane, 4, dt)
  damp(columnCamera, chosen.x, 3.7, dt)
  damp(rail, -2.17 - chosen.z, 3.7, dt)
  const trackX = columnCamera.value
  pulses = pulses.filter(p => time - p.time < 3.2)
  const idle = !REDUCE && !targetDetail && detail < 0.01 && time - lastInteraction > 2.5
  idleGain = THREE.MathUtils.lerp(idleGain, idle ? 1 : 0, 1 - Math.exp(-dt * (idle ? 0.8 : 4)))
  pulseGain = THREE.MathUtils.lerp(pulseGain, targetDetail ? 0 : 1, 1 - Math.exp(-dt * 8))
  const field = (row, lane) => {
    let ripple = 0
    if (!REDUCE) for (const p of pulses) ripple += baselineSelectionWave(Math.hypot(row - p.row, (lane - p.lane) * 2.2), time - p.time)
    return settlingWave(row - shoulder.value, 26.56) * columnStrength(lane, laneFocus.value) + idleWave(row, lane, time) * idleGain + THREE.MathUtils.clamp(ripple, -0.6, 0.6) * pulseGain
  }
  damp(lift, targetDetail ? INSPECTION_LIFT : 0.4, REDUCE ? 35 : 4.2, dt)
  const cameraTarget = targetDetail ? ease((lift.value - 0.8) / 2.4) : ease((lift.value - 0.4) / (INSPECTION_LIFT - 0.4))
  detail = THREE.MathUtils.lerp(detail, cameraTarget, 1 - Math.exp(-dt * (REDUCE ? 35 : 2.8)))
  applyAppearance(ease(lift.value / 0.4))
  // 抬到位、镜头就位后开始解密（约 1.6 秒）；返回阵列时迅速恢复磨砂
  const clearTarget = targetDetail && detail > 0.78 && lift.value > 3.3 ? 1 : 0
  clarity += clearTarget ? Math.min(1 - clarity, dt / 1.6) : -Math.min(clarity, dt * 4)
  applyClarity(ease(clarity))
  model.position.set(chosen.x - trackX, chosen.y + field(selectedCell.row, selectedCell.lane) + lift.value + hoverLift(selectedCell), chosen.z + rail.value)
  model.rotation.set((field(selectedCell.row + .5, selectedCell.lane) - field(selectedCell.row - .5, selectedCell.lane)) * 0.024 * (1 - detail) * (1 - ease(lift.value / 0.4)), 0, 0)

  // 镜头：长焦，阵列取景 140 单位外；读取时拉近到 72，档案放到画面左侧
  const viewDirection = baseDirection.clone().lerp(new THREE.Vector3(-0.277, 0.238, 0.931), detail).normalize()
  const distance = THREE.MathUtils.lerp(ARRAY_DISTANCE, DETAIL_DISTANCE, detail)
  const span = VIEW_SPAN + (5.9 - VIEW_SPAN) * detail
  const right = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), viewDirection).normalize()
  const up = new THREE.Vector3().crossVectors(viewDirection, right).normalize()
  const pixelScale = 1080 / span
  const detailAim = model.position.clone().add(new THREE.Vector3(0, 1.85, 0))
  detailAim.addScaledVector(right, (0.5 - 550 / 1920) * 1920 / pixelScale)
  detailAim.addScaledVector(up, (560 / 1080 - 0.5) * 1080 / pixelScale)
  const aim = arrayAim.clone().lerp(detailAim, detail)
  const camPos = aim.clone().addScaledVector(viewDirection, distance)
  const blend = 1 - Math.exp(-dt * 5)
  camera.position.lerp(camPos, blend)
  cameraAim.lerp(aim, blend)
  camera.lookAt(cameraAim)
  camera.fov = THREE.MathUtils.lerp(camera.fov, THREE.MathUtils.radToDeg(2 * Math.atan(span / (2 * distance))), blend)
  const rendered = camera.position.distanceTo(cameraAim)
  scene.fog.near = rendered + THREE.MathUtils.lerp(5, -1, detail)
  scene.fog.far = rendered + THREE.MathUtils.lerp(25, 12, detail)
  camera.updateProjectionMatrix()
  camera.updateMatrixWorld()

  // 阵列实例：当前列左右各 3 列、当前行前后 18 行；数据按周期取模，首尾自然衔接
  drawnCells = []
  let i = 0
  for (let lane = selectedCell.lane - 3; lane <= selectedCell.lane + 3; lane++) {
    for (let row = selectedCell.row - 18; row <= selectedCell.row + 18; row++) {
      if (lane === selectedCell.lane && row === selectedCell.row) continue
      if (i >= MAX) break
      const c = { lane, row }
      const x = (lane - 2) * COLUMN_SPACING - trackX
      const y = -4.6 + field(row, lane) + hoverLift(c)
      const z = (row - 15.5) * ROW_SPACING + rail.value
      if (Math.abs(x) > 19 || z < -16 || z > 14) continue
      const slope = field(row + .5, lane) - field(row - .5, lane)
      dummy.position.set(x, y, z)
      dummy.rotation.set(slope * 0.024 * (1 - detail), 0, 0)
      dummy.updateMatrix()
      for (const inst of instances) inst.setMatrixAt(i, dummy.matrix)
      drawnCells.push(c)
      i++
    }
  }
  for (const inst of instances) { inst.count = i; inst.instanceMatrix.needsUpdate = true }
  if (instances[0]) instances[0].computeBoundingSphere()

  // 景深焦点跟随选中档案
  const focal = model.position.clone().add(new THREE.Vector3(0, 2, 0)).applyMatrix4(camera.matrixWorldInverse)
  bokeh.uniforms.focus.value = -focal.z
  bokeh.uniforms.aperture.value = THREE.MathUtils.lerp(0.0003, 0.0008, detail)
  key.shadow.needsUpdate = true
  composer.render()

  // 详情正文随镜头进度显现
  $('detail-content').style.opacity = String(THREE.MathUtils.clamp((detail - 0.55) / 0.35, 0, 1))
  return (clearTarget ? clarity < 1 : clarity > 0) || Math.abs(lift.velocity) > 1e-4 || Math.abs(detail - cameraTarget) > 1e-3 || pulses.length > 0 || Math.abs(rail.velocity) > 1e-4 || Math.abs(columnCamera.velocity) > 1e-4 || hoverLifts.size > 0 || idleGain > 0.001 || idle
}

// ── 按需绘制（空闲呼吸期间保持逐帧） ──
let running = false
function tick(t) {
  if (update(t / 1000)) requestAnimationFrame(tick)
  else { running = false; last = 0 }
}
function wake() { if (!running) { running = true; requestAnimationFrame(tick) } }

// ── 文字（滚动） ──
function roll(el, text, dir = 1) {
  text = String(text)
  if (el.dataset.v === text) return
  const first = el.dataset.v === undefined
  el.dataset.v = text
  el.classList.add('roll')
  if (first || REDUCE) { el.innerHTML = ''; const n = document.createElement('span'); n.textContent = text; el.appendChild(n); el.style.width = ''; return }
  const w0 = el.offsetWidth, old = [...el.children]
  const n = document.createElement('span'); n.textContent = text; el.appendChild(n)
  const e = 'cubic-bezier(.22,1,.36,1)'
  old.forEach(o => {
    o.classList.add('out'); o.setAttribute('aria-hidden', 'true'); o.getAnimations().forEach(a => a.cancel())
    o.animate([{ transform: 'none', opacity: 1, filter: 'blur(0)' }, { transform: `translateY(${-100 * dir}%)`, opacity: 0, filter: 'blur(.2px)' }], { duration: 460, easing: e, fill: 'forwards' }).onfinish = () => o.remove()
    setTimeout(() => o.isConnected && o.remove(), 520)
  })
  const w1 = n.offsetWidth
  el.style.width = w0 + 'px'; void el.offsetWidth; el.style.width = w1 + 'px'
  n.animate([{ transform: `translateY(${100 * dir}%)`, opacity: 0, filter: 'blur(.2px)' }, { transform: 'none', opacity: 1, filter: 'blur(0)' }], { duration: 460, easing: e })
}
function updateText(dir) {
  const r = records[selected], lane = wrap(selectedCell.lane, COLUMNS.length), files = columnFiles(lane)
  roll($('archive-category'), r.category, dir)
  roll($('selected-id'), r.id, dir)
  roll($('selected-title'), r.kind === '账号' ? r.title : r.category + ' · 脚本配置', dir)
  roll($('selected-clearance'), r.clearance, dir)
  roll($('selected-number'), String(files.indexOf(selected) + 1).padStart(2, '0'), dir)
  roll($('count-total'), String(files.length).padStart(2, '0'), dir)
  roll($('column-number'), `COLUMN ${String(lane + 1).padStart(2, '0')} / ${String(COLUMNS.length).padStart(2, '0')}`, dir)
  roll($('column-name'), COLUMNS[lane].name, dir)
  $('file-ticks').innerHTML = files.map((f, k) => `<button type="button" class="${f === selected ? 'selected' : ''}" aria-label="${k + 1}" data-k="${k}"></button>`).join('')
}
$('file-ticks').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return
  const files = columnFiles(wrap(selectedCell.lane, COLUMNS.length))
  const d = Number(b.dataset.k) - files.indexOf(selected)
  if (d) select({ cell: { lane: selectedCell.lane, row: selectedCell.row + d } })
})

// ── 详情 ──
let tab = 'overview'
function renderDetail() {

  $('object-id').textContent = 'NO.' + String(selected + 1).padStart(3, '0')
  $('detail-content').innerHTML = `

  <h2>${r.en}</h2><div class="detail-title-cn">${r.title}<span>${r.category}</span></div>

  <div id="tab-panel" class="tab-panel">${panel(r)}</div>
  <div class="detail-actions"><button type="button" class="solid-button">＋ SAVE CONFIG<span>保存配置</span></button><button type="button" class="export-button">RUN <span>↗</span></button></div>
  <div class="detail-footnote"><span>配置来源：${r.base}</span><span>${String(selected + 1).padStart(3, '0')} / ${String(records.length).padStart(3, '0')}</span></div>`
  moveIndicator()
}
function panel(r) {
  if (tab === 'overview') return `<div class="panel-label">ABSTRACT / 摘要</div><p>${r.kind === '账号' ? `「${r.title}」由脚本「${r.category}」托管，配置来源为${r.base}。每日按队列定时运行，单次运行时限 60 分钟，失败时按重启清单补跑。` : `「${r.category}」的脚本级配置：启动程序、日志判定、游戏启动方式与运行限制。修改后对本脚本下所有使用共享配置的账号生效。`}</p>`
  if (tab === 'notes') return `<div class="panel-label">RUN RECORDS / 运行记录</div><ul class="research-notes"><li><span>11-20</span>06:12 完成 · 一条龙完成 → Success!</li><li><span>11-19</span>06:10 完成 · 用时 9 分 42 秒</li><li><span>11-18</span>06:15 异常 · 等待游戏窗口超时，已补跑</li></ul>`
  return `<div class="panel-label">ACCESS LOG / 访问日志</div>${['11-20 06:00', '11-19 18:02', '11-18 06:00'].map(t => `<div class="log-row"><span>${t}</span><span>AUTO-MAS</span><b>READ AUTHORIZED</b></div>`).join('')}`
}
function moveIndicator() {
  const tabs = document.querySelector('.detail-tabs'); if (!tabs) return
  const on = tabs.querySelector('button.active'), ind = tabs.querySelector('.tab-indicator')
  ind.style.transform = `translateX(${on.offsetLeft}px) scaleX(${on.offsetWidth})`
}
$('detail-content').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return
  tab = b.dataset.tab
  document.querySelectorAll('.detail-tabs button').forEach(x => x.classList.toggle('active', x === b))
  moveIndicator()
  const p = $('tab-panel'); p.innerHTML = panel(records[selected]); p.classList.remove('fade'); void p.offsetWidth; p.classList.add('fade')
})
function openDetail() {
  if (targetDetail) return
  targetDetail = 1; tab = 'overview'
  stage.dataset.mode = 'detail'
  $('detail-ui').hidden = false
  renderDetail(); wake()
}
function closeDetail() {
  if (!targetDetail) return
  targetDetail = 0
  stage.dataset.mode = 'archive'
  setTimeout(() => { if (!targetDetail) $('detail-ui').hidden = true }, 600)
  wake()
}

// ── 输入 ──
const nav = (axis, direction) => { if (targetDetail) return; select({ axis, direction }) }
addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); nav('row', 1) }
  else if (e.key === 'ArrowUp') { e.preventDefault(); nav('row', -1) }
  else if (e.key === 'ArrowRight') { e.preventDefault(); nav('lane', 1) }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); nav('lane', -1) }
  else if (e.key === 'Enter') openDetail()
  else if (e.key === 'Escape') closeDetail()
})
let wheelAt = 0
stage.addEventListener('wheel', e => {
  e.preventDefault()
  if (performance.now() - wheelAt < 90) return
  wheelAt = performance.now()
  if (Math.abs(e.deltaX) > Math.abs(e.deltaY) || e.shiftKey) nav('lane', (e.deltaX || e.deltaY) > 0 ? 1 : -1)
  else nav('row', e.deltaY > 0 ? 1 : -1)
}, { passive: false })
stage.addEventListener('click', e => {
  const a = e.target.closest('[data-action]'); if (!a) return
  const act = a.dataset.action
  if (act === 'prev') nav('row', -1); else if (act === 'next') nav('row', 1)
  else if (act === 'column-prev') nav('lane', -1); else if (act === 'column-next') nav('lane', 1)
  else if (act === 'open') openDetail(); else if (act === 'back') closeDetail()
})
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2()
function pick(e) {
  const r = renderer.domElement.getBoundingClientRect()
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1)
  ray.setFromCamera(ndc, camera)
  const hitSel = ray.intersectObject(model, true)[0]
  const hitArr = instances[0] ? ray.intersectObject(instances[0])[0] : null
  if (hitSel && (!hitArr || hitSel.distance <= hitArr.distance)) return { ...selectedCell }
  return hitArr ? drawnCells[hitArr.instanceId] : null
}
const same = (a, b) => a && b && a.lane === b.lane && a.row === b.row
renderer.domElement.addEventListener('pointermove', e => {
  if (targetDetail) return
  const c = pick(e)
  const h = c && !same(c, selectedCell) ? c : null
  if (!same(h, hoverCell) && (h || hoverCell)) {
    hoverCell = h
    renderer.domElement.style.cursor = c ? 'pointer' : 'default'
    const lab = $('hover-label')
    if (hoverCell) { const r = records[fileAtCell(hoverCell)]; lab.hidden = false; lab.textContent = `${r.id} / ${r.title}` } else lab.hidden = true
    lastInteraction = clock
    wake()
  }
})
renderer.domElement.addEventListener('click', e => {
  if (targetDetail) return
  const c = pick(e); if (!c) return
  if (same(c, selectedCell)) openDetail()
  else select({ cell: c })
})

setInterval(() => { $('clock').textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false }) }, 1000)
await load()
drawLabel(selected)
updateText(1)
container.classList.add('on')
$('loading').classList.add('done')
wake()
// 停止操作 2.5 秒后进入呼吸：此时唤醒绘制循环（呼吸期间 update 返回 true 保持逐帧）
setInterval(() => { if (!running && !targetDetail && clock - lastInteraction > 2.4) wake() }, 2000)
// 测试用：后台页 rAF 暂停时，手动逐帧推进动画
function advance(sec) { let t = clock || performance.now() / 1000; for (let k = 0; k < Math.round(sec * 60); k++) { t += 1 / 60; update(t) } }
function snap(w = 480) { const c = document.createElement("canvas"); c.width = w; c.height = Math.round(w * 9 / 16); c.getContext("2d").drawImage(renderer.domElement, 0, 0, c.width, c.height); return c.toDataURL("image/jpeg", 0.8) }
window.__array = { nav, openDetail, closeDetail, advance, snap, debug: () => ({ cam: camera.position.toArray().map(v => +v.toFixed(2)), aim: cameraAim.toArray().map(v => +v.toFixed(2)), model: model.position.toArray().map(v => +v.toFixed(2)), fov: +camera.fov.toFixed(3), fog: [scene.fog.near, scene.fog.far].map(v => +v.toFixed(1)), visible: model.visible, n: instances[0]?.count }), state: () => ({ selected, selectedCell: { ...selectedCell }, detail, lift: lift.value }) }
</script>
</body>
</html>
