<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/AUTO-MAS.ico" />
    <title>AUTO-MAS</title>
    <script>
      ;(function () {
        var resolved = null
        try {
          resolved = localStorage.getItem('auto-mas.theme.resolved')
        } catch (e) {}
        var dark =
          resolved === 'dark' ||
          (resolved !== 'light' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        color-scheme: light;
        background-color: var(--ant-color-bg-layout, #e4e1db);
        color: var(--ant-color-text, #111411);
      }

      html.dark,
      html.dark body {
        color-scheme: dark;
        background-color: var(--ant-color-bg-layout, #0f1417);
        color: var(--ant-color-text, #e2e5de);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/browser.ts"></script>
  </body>
</html>
