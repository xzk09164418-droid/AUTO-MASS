<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--bg:#e8e5e1;--ink:#111411;--dim:#7e7a70;--line:rgba(17,20,17,.10);--y:#d96b27;
font-size:max(10px,min(.8334vw,1.4815vh))}
@media (orientation:portrait){:root{font-size:max(12px,min(4.2vw,1.9vh))}}
@media (prefers-color-scheme:dark){:root[data-theme="auto"]{--bg:#111619;--ink:#e2e5de;--dim:#6d7b80;--line:rgba(226,229,222,.10);--y:#e8823a}}
:root[data-theme="dark"]{--bg:#111619;--ink:#e2e5de;--dim:#6d7b80;--line:rgba(226,229,222,.10);--y:#e8823a}
html,body{height:100%;margin:0}
body{background:#fff;font-family:"Bahnschrift","DIN Alternate","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;color:var(--ink)}
.mono{font-family:"JetBrains Mono","SF Mono",Consolas,monospace}

/* 热启动：总时长约 0.9s = 入场 0.45s + 划屏 0.45s */
#stage{position:fixed;z-index:5;inset:0;height:100vh;height:100dvh;background:var(--bg);overflow:hidden;
--t:env(safe-area-inset-top,0px);--b:env(safe-area-inset-bottom,0px);--l:env(safe-area-inset-left,0px);--r:env(safe-area-inset-right,0px)}
#stage.open{background:transparent}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:3rem 3rem;background-position:center;opacity:0;animation:fade .25s forwards;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 85%);-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 85%)}
@keyframes fade{to{opacity:1}}
.corner{position:absolute;width:1.75rem;height:1.75rem;border:max(2px,.125rem) solid var(--ink);opacity:0;animation:fade .2s .05s forwards}
.c1{top:calc(1.25rem + var(--t));left:calc(1.25rem + var(--l));border-right:0;border-bottom:0}
.c2{top:calc(1.25rem + var(--t));right:calc(1.25rem + var(--r));border-left:0;border-bottom:0}
.c3{bottom:calc(1.25rem + var(--b));left:calc(1.25rem + var(--l));border-right:0;border-top:0}
.c4{bottom:calc(1.25rem + var(--b));right:calc(1.25rem + var(--r));border-left:0;border-bottom:0;border-top:0}
.c4{border-left:0;border-top:0;border-right:max(2px,.125rem) solid var(--ink);border-bottom:max(2px,.125rem) solid var(--ink)}
.tag{position:absolute;top:calc(1.5rem + var(--t));left:calc(3.5rem + var(--l));font-size:max(10px,.75rem);letter-spacing:.18em;color:var(--dim);opacity:0;animation:fade .2s .1s forwards}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;padding:var(--t) 1.5rem var(--b)}
.logo{width:5rem;height:5rem;opacity:0;animation:fade .15s forwards}
.logo svg{width:100%;height:100%;overflow:visible}
.ring{transform-origin:50% 50%;animation:spin 6s linear infinite}
.ring2{transform-origin:50% 50%;animation:spin 1.2s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.draw{stroke-dasharray:300;stroke-dashoffset:300;animation:draw .32s .02s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.word{display:flex;font-weight:800;font-size:min(4.5rem,13vw);letter-spacing:.06em;line-height:1}
.word span{display:inline-block;clip-path:inset(0 0 100% 0);transform:translateY(40%);animation:rise .28s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{to{clip-path:inset(0 0 0 0);transform:none}}
.flow{position:relative;display:flex;justify-content:space-between;align-items:center;width:min(20rem,70vw);height:1rem}
.flow::before{content:"";position:absolute;left:0;right:0;top:50%;height:max(2px,.125rem);background:var(--line);transform:translateY(-50%)}
.flow u{position:absolute;left:0;top:50%;height:max(2px,.125rem);width:0;background:var(--ink);transform:translateY(-50%);animation:line .22s .2s linear forwards}
@keyframes line{to{width:100%}}
.flow i{position:relative;width:.8rem;height:.8rem;background:var(--bg);border:max(2px,.125rem) solid var(--ink);transform:rotate(45deg);animation:node .18s forwards;animation-delay:calc(.2s + var(--i)*.04s)}
@keyframes node{to{background:var(--y);transform:rotate(225deg) scale(1.15)}}
.state{font-size:max(10px,.7rem);letter-spacing:.4em;color:var(--dim);opacity:0;animation:fade .15s .2s forwards}

/* 退场划屏 0.45s：0.22s 时完全盖满（此刻换场） */
#out{position:absolute;inset:0;background:var(--y);transform:translateX(-101%);pointer-events:none}
#out.go{animation:wipe .45s cubic-bezier(.7,0,.25,1) forwards}
@keyframes wipe{0%{transform:translateX(-101%)}50%{transform:translateX(0)}100%{transform:translateX(101%)}}

@media (max-width:640px){.tag{left:calc(3rem + var(--l))}}
@media (max-height:480px) and (orientation:landscape){.center{gap:.6rem}.logo{width:3.4rem;height:3.4rem}.word{font-size:3rem}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}

html,body{background:transparent!important} #stage.open{background:transparent} #out.cover{animation:cover .225s ease-in forwards} #out.reveal{animation:reveal .225s ease-out forwards} @keyframes cover{from{transform:translateX(-101%)}to{transform:translateX(0)}} @keyframes reveal{from{transform:translateX(0)}to{transform:translateX(101%)}}.flow u,.flow i{animation:none}.flow i.on{background:var(--y);transform:rotate(225deg) scale(1.15)}.state{max-width:80vw;letter-spacing:.08em;overflow-wrap:anywhere}</style></head><body><div id="stage">
  <div class="grid"></div>
  <div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>
  <div class="tag mono">RHINE LAB // RESUME TERMINAL</div>
  <div class="center">
    <div class="logo">
      <svg viewBox="0 0 310 145" role="img" aria-label="AUTO-MAS Rhine Lab">
        <g fill="none" stroke="currentColor" stroke-linejoin="miter">
          <path class="draw" d="M156 75C127 48 103 15 70 15C37 15 15 39 15 70S38 128 70 128C103 128 127 96 176 52M155 75C182 99 208 128 240 128C273 128 295 105 295 73S273 15 240 15C221 15 207 23 192 38" stroke-width="22"/>
          <path d="M44 70h50M69 45v50M219 70h44" stroke-width="14"/>
          <circle cx="240" cy="70" r="8" fill="var(--y)" stroke="none"/>
        </g>
      </svg>
    </div>
    <div class="word" id="word" aria-label="AUTO-MAS"></div>
    <div class="flow"><u></u><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i></div>
    <div class="state mono">RESUMING</div>
  </div>
  <div id="out"></div>
</div>
<script>
const cold='warm'==='cold', reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const intro=reduced?0:(cold?1900:450), started=performance.now();
const $=id=>document.getElementById(id);
let ready=false, exiting=false, progress=0, target=0;
'AUTO-MAS'.split('').forEach((c,i)=>{const el=document.createElement('span');el.textContent=c;el.style.animationDelay=(cold?.45+i*.06:i*.035)+'s';$('word').appendChild(el)});
if(cold){for(let i=0;i<20;i++)$('seg').appendChild(document.createElement('i'));}
function exit(){
 if(exiting)return;exiting=true;
 const stage=$('stage'),out=$('out');
 const close=()=>{stage.remove();parent.postMessage({type:'mas-splash-closed'},'*')};
 const covered=()=>{
  stage.querySelectorAll('.center,.tag,.corner,.grid,.sweep').forEach(el=>el.style.visibility='hidden');
  stage.classList.add('open');parent.postMessage({type:'mas-splash-ready'},'*');
  if(reduced){close();return}
  out.addEventListener('animationend',close,{once:true});out.className='reveal';
 };
 if(reduced){covered();return}
 out.addEventListener('animationend',covered,{once:true});out.className='cover';
}
addEventListener('message',event=>{
 if(event.source!==parent||event.data?.type!=='mas-splash-state')return;
 document.documentElement.dataset.theme=event.data.dark?'dark':'light';
 ready=!!event.data.ready;target=ready?100:Math.max(target,event.data.progress||0);
 if(!cold)document.querySelector('.state').textContent=event.data.label||'RESUMING';
 if(cold&&$('stat'))$('stat').textContent=event.data.error||event.data.label||'LOADING';
 if(cold){$('bn').textContent=event.data.version||'';const label=event.data.label||'LOADING';if($('log').lastElementChild?.textContent!==label){const line=document.createElement('div');line.textContent=label;$('log').appendChild(line);while($('log').children.length>3)$('log').firstElementChild.remove();}}
});
function tick(){
 const elapsed=performance.now()-started;
 const goal=reduced||!cold?target:Math.min(target,Math.max(0,elapsed-intro)/1500*100);
 progress=reduced||!cold?goal:progress+(goal-progress)*.09;
 if(goal-progress<.2)progress=goal;
 if(cold){
  $('pct').textContent=Math.floor(progress)+'%';
  [...$('seg').children].forEach((el,i)=>el.className=i<Math.round(progress/5)?'on':'');
 }
 const flow=document.querySelector('.flow');
 const nodes=flow.getElementsByTagName('i');[...nodes].forEach((el,i)=>el.className=progress>=i/(nodes.length-1)*100&&progress>0?'on':'');
 flow.getElementsByTagName('u')[0].style.width=progress+'%';
 flow.setAttribute('role','progressbar');flow.setAttribute('aria-label','AUTO-MAS');flow.setAttribute('aria-valuemin','0');flow.setAttribute('aria-valuemax','100');flow.setAttribute('aria-valuenow',String(Math.floor(progress)));
 if(ready&&elapsed>=intro&&progress>=99.99){exit();return}
 requestAnimationFrame(tick);
}
parent.postMessage({type:'mas-splash-loaded'},'*');tick();
</script></body></html>
